  <script>
    // ==============================
    // Supabase 联机配置
    // ==============================
    const USE_SUPABASE = true;
    const SUPABASE_URL = "https://mqlctakdtjanshgsdwal.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_mLz7oSFvfPZDFxJgApI1JA_0oE4gla1";
    const supabaseClient = USE_SUPABASE && window.supabase
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    const ENTRY_KEY = "study_archive_entries_v2";
    const SETTINGS_KEY = "study_archive_settings_v2";
    const VIEW_KEY = "study_archive_view_v2";
    const today = new Date().toISOString().slice(0, 10);

    const SECTIONS = {
      deploy: { label: "待部署", icon: "rocket" },
      focus: { label: "本周重点", icon: "target" },
      review: { label: "复习清单", icon: "book-open" }
    };

    const seedEntries = [
      { id: crypto.randomUUID(), section: "deploy", title: "学习板块独立部署", subtitle: "更新极简现代 UI 系统", tag: "前端", dueDate: today, link: "", note: "测试过渡动画和 Supabase 同步情况。" },
      { id: crypto.randomUUID(), section: "focus", title: "毕业论文与核心架构并行", subtitle: "将高优先级任务具象化", tag: "高优", dueDate: today, link: "", note: "不在系统里做复杂的甘特图，只保留直观任务流。" },
      { id: crypto.randomUUID(), section: "review", title: "复盘 Supabase RLS", subtitle: "行级安全策略配置", tag: "后端", dueDate: "", link: "https://supabase.com/docs", note: "检查表权限和 API 请求的安全边界。" }
    ];

    let entries = [];
    let settings = { calendarEmbedUrl: "" };
    let currentView = localStorage.getItem(VIEW_KEY) || "board";

    const $ = (id) => document.getElementById(id);

    function saveLocal() { localStorage.setItem(ENTRY_KEY, JSON.stringify(entries)); }
    function saveSettingsLocal() { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }

    async function fetchEntriesFromSupabase() {
      if (!supabaseClient) return null;
      const { data, error } = await supabaseClient
        .from("study_entries")
        .select("id,section,title,subtitle,tag,due_date,link,note,created_at")
        .order("created_at", { ascending: false });
      if (error) return null;
      return (data || []).map(item => ({
        id: item.id, section: item.section, title: item.title, subtitle: item.subtitle,
        tag: item.tag, dueDate: item.due_date, link: item.link, note: item.note, createdAt: item.created_at
      }));
    }

    async function saveEntryToSupabase(entry) {
      if (!supabaseClient) return true;
      const payload = {
        id: entry.id, section: entry.section, title: entry.title, subtitle: entry.subtitle,
        tag: entry.tag, due_date: entry.dueDate || null, link: entry.link || null, note: entry.note || null
      };
      const { error } = await supabaseClient.from("study_entries").upsert(payload);
      if (error) { alert("保存失败：" + error.message); return false; }
      return true;
    }

    async function deleteEntryFromSupabase(id) {
      if (!supabaseClient) return true;
      const { error } = await supabaseClient.from("study_entries").delete().eq("id", id);
      if (error) { alert("删除失败：" + error.message); return false; }
      return true;
    }

    async function fetchSettingsFromSupabase() {
      if (!supabaseClient) return null;
      const { data, error } = await supabaseClient.from("app_settings").select("setting_key,setting_value");
      if (error) return null;
      const result = {};
      (data || []).forEach(item => result[item.setting_key] = item.setting_value || "");
      return result;
    }

    async function saveSettingToSupabase(key, value) {
      if (!supabaseClient) return true;
      const { error } = await supabaseClient.from("app_settings").upsert({ setting_key: key, setting_value: value });
      if (error) { alert("保存失败：" + error.message); return false; }
      return true;
    }

    async function init() {
      const cloudEntries = await fetchEntriesFromSupabase();
      const localEntries = JSON.parse(localStorage.getItem(ENTRY_KEY) || "null");
      
      let rawEntries = cloudEntries || localEntries || seedEntries;
      entries = rawEntries.filter(e => SECTIONS[e.section]); 
      
      if (!cloudEntries && !localEntries) saveLocal();

      const cloudSettings = await fetchSettingsFromSupabase();
      const localSettings = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "null");
      settings = { calendarEmbedUrl: "", ...(cloudSettings || localSettings || {}) };
      if (!cloudSettings && !localSettings) saveSettingsLocal();

      renderAll();
    }

    function getFilteredEntries() {
      return entries.sort((a, b) => {
        const at = a.dueDate ? new Date(a.dueDate).getTime() : 0;
        const bt = b.dueDate ? new Date(b.dueDate).getTime() : 0;
        return (bt || 0) - (at || 0);
      });
    }

    function renderCalendar() {
      const src = (settings.calendarEmbedUrl || "").trim();
      $("calendarWrap").innerHTML = src
        ? `<iframe src="${src}" loading="lazy" class="w-full h-full rounded-xl shadow-inner border border-border/50"></iframe>`
        : `<div class="w-full h-full min-h-[200px] flex flex-col items-center justify-center text-center p-6 border border-dashed border-border rounded-xl bg-white">
            <div class="w-12 h-12 bg-muted rounded-full flex items-center justify-center mb-4 text-muted-foreground"><i data-lucide="calendar-off" class="w-5 h-5"></i></div>
            <strong class="text-sm font-semibold text-foreground mb-1">未绑定日历</strong>
            <p class="text-xs text-muted-foreground">点击右上角设置图标嵌入外部日历视图</p>
           </div>`;
    }

    function renderBoard() {
      Object.keys(SECTIONS).forEach(key => {
        const target = $(`${key}List`);
        const items = getFilteredEntries().filter(item => item.section === key);
        
        target.innerHTML = items.length
          ? items.map(item => createBoardCard(item)).join("")
          : `<div class="p-6 border border-dashed border-border rounded-xl text-center text-sm text-muted-foreground bg-transparent">暂无任务</div>`;
      });
    }

    function createBoardCard(item) {
      const isFocus = item.section === 'focus';
      return `
        <div class="bg-card rounded-xl border ${isFocus ? 'border-accent/20' : 'border-border'} shadow-sm hover:shadow-lg hover:-translate-y-1 transition-all duration-300 p-5 group relative overflow-hidden">
          ${isFocus ? '<div class="absolute top-0 right-0 w-16 h-16 bg-accent opacity-[0.03] rounded-bl-full pointer-events-none"></div>' : ''}
          <div class="flex justify-between items-start gap-4 mb-3 relative z-10">
            <div class="min-w-0 flex-1">
              <h4 class="font-semibold text-base text-foreground leading-snug mb-1 truncate">${item.title || "未命名任务"}</h4>
              ${item.subtitle ? `<div class="text-xs text-muted-foreground truncate">${item.subtitle}</div>` : ""}
            </div>
            <div class="shrink-0 flex items-center gap-1.5 opacity-0 group-hover:opacity-100 transition-opacity">
              <button class="w-7 h-7 rounded-md bg-muted text-muted-foreground hover:bg-accent hover:text-white flex items-center justify-center transition-colors" data-complete="${item.id}" title="完成">
                <i data-lucide="check" class="w-3.5 h-3.5"></i>
              </button>
              <button class="w-7 h-7 rounded-md bg-muted text-muted-foreground hover:text-foreground flex items-center justify-center transition-colors" data-edit="${item.id}" title="编辑">
                <i data-lucide="edit-2" class="w-3 h-3"></i>
              </button>
            </div>
          </div>
          
          <div class="flex flex-wrap gap-2 mb-3 relative z-10">
            ${item.tag ? `<span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-mono uppercase tracking-wider bg-muted text-muted-foreground">${item.tag}</span>` : ""}
            ${item.dueDate ? `<span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-mono uppercase tracking-wider border border-accent/20 text-accent bg-accent/5">${item.dueDate}</span>` : ""}
          </div>
        </div>
      `;
    }

    function renderList() {
      const items = getFilteredEntries();
      
      $("listView").innerHTML = items.length
        ? items.map(item => `
          <div class="bg-card rounded-xl border border-border shadow-sm hover:shadow-md transition-all p-3 md:p-4 flex flex-row items-center gap-3 md:gap-4 group">
            
            <button class="shrink-0 w-5 h-5 rounded border border-muted-foreground/40 flex items-center justify-center hover:border-accent hover:bg-accent/10 transition-colors group/cb" data-complete="${item.id}" title="完成任务">
              <i data-lucide="check" class="w-3 h-3 text-transparent group-hover/cb:text-accent transition-colors"></i>
            </button>

            <div class="flex-1 min-w-0 flex flex-col md:flex-row md:items-center justify-between gap-1 md:gap-4">
               <div class="flex-1 min-w-0">
                  <h4 class="font-semibold text-foreground text-[13px] md:text-sm truncate">${item.title}</h4>
                  ${item.subtitle ? `<p class="text-xs text-muted-foreground truncate mt-0.5">${item.subtitle}</p>` : ''}
               </div>
               
               <div class="flex items-center gap-2 shrink-0">
                  ${item.tag ? `<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-mono uppercase tracking-wider bg-muted text-muted-foreground">${item.tag}</span>` : ""}
                  ${item.dueDate ? `<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-mono text-accent bg-accent/5 border border-accent/10">${item.dueDate}</span>` : ''}
               </div>
            </div>

            <div class="shrink-0 flex items-center md:opacity-0 group-hover:opacity-100 transition-opacity">
              <button class="p-1.5 rounded-md text-muted-foreground hover:bg-muted hover:text-foreground transition-colors" data-edit="${item.id}">
                <i data-lucide="edit-2" class="w-4 h-4 md:w-3.5 md:h-3.5"></i>
              </button>
            </div>
          </div>
        `).join("")
        : `<div class="p-10 border border-dashed border-border rounded-xl text-center text-sm text-muted-foreground bg-transparent">暂无符合条件的条目</div>`;
    }

    function bindAllActions() {
      // Re-bind click events for dynamic elements
      document.querySelectorAll("[data-edit]").forEach(btn => {
        btn.replaceWith(btn.cloneNode(true)); // prevent duplicate listeners
      });
      document.querySelectorAll("[data-complete]").forEach(btn => {
        btn.replaceWith(btn.cloneNode(true));
      });

      document.querySelectorAll("[data-edit]").forEach(btn => btn.addEventListener("click", () => openEntryModal(null, btn.dataset.edit)));
      document.querySelectorAll("[data-complete]").forEach(btn => btn.addEventListener("click", () => completeEntry(btn.dataset.complete)));
    }

    async function completeEntry(id) {
      if (!id) return;

      const ok = await deleteEntryFromSupabase(id);
      if (USE_SUPABASE && !ok) return;

      entries = entries.filter(item => item.id !== id);
      saveLocal();
      renderAll();
    }

    function renderView() {
      const isBoard = currentView === "board";

      // 手机端强制显示清单 (flex)，隐藏看板。电脑端遵循 isBoard 判断。
      $("boardView").className = isBoard 
        ? "hidden md:grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 items-start auto-rows-min" 
        : "hidden";

      $("listView").className = isBoard 
        ? "flex md:hidden flex-col gap-3" 
        : "flex flex-col gap-3";

      // 电脑端切换按钮状态
      if (isBoard) {
        $("boardViewBtn").className = "flex-1 py-2.5 text-sm font-semibold rounded-lg bg-white text-foreground shadow-sm transition-all flex items-center justify-center gap-2";
        $("listViewBtn").className = "flex-1 py-2.5 text-sm font-medium rounded-lg text-muted-foreground hover:text-foreground transition-all flex items-center justify-center gap-2";
      } else {
        $("listViewBtn").className = "flex-1 py-2.5 text-sm font-semibold rounded-lg bg-white text-foreground shadow-sm transition-all flex items-center justify-center gap-2";
        $("boardViewBtn").className = "flex-1 py-2.5 text-sm font-medium rounded-lg text-muted-foreground hover:text-foreground transition-all flex items-center justify-center gap-2";
      }

      renderCalendar();
      if (isBoard) renderBoard();
      renderList(); // 清单视图在手机端总是需要渲染的
      
      bindAllActions();
      lucide.createIcons();
    }

    function renderAll() { renderView(); }

    function openEntryModal(section = "deploy", id = "") {
      const item = id ? entries.find(entry => entry.id === id) : null;
      $("entryForm").reset();
      $("editingId").value = item?.id || "";
      $("sectionInput").value = item?.section || section || "deploy";
      $("tagInput").value = item?.tag || "";
      $("titleInput").value = item?.title || "";
      $("subtitleInput").value = item?.subtitle || "";
      $("dateInput").value = item?.dueDate || "";
      $("linkInput").value = item?.link || "";
      $("noteInput").value = item?.note || "";
      
      $("entryModalTitle").innerHTML = item ? "编辑条目" : "新增条目";
      $("deleteEntryBtn").classList.toggle("invisible", !item);
      
      $("entryModal").classList.remove("hidden");
      $("entryModal").classList.add("flex");
      setTimeout(() => { $("entryModal").firstElementChild.classList.add("scale-100", "opacity-100"); $("entryModal").firstElementChild.classList.remove("scale-95", "opacity-0"); }, 10);
      lucide.createIcons();
    }

    function closeEntryModal() { 
      $("entryModal").firstElementChild.classList.remove("scale-100", "opacity-100"); 
      $("entryModal").firstElementChild.classList.add("scale-95", "opacity-0");
      setTimeout(() => {
        $("entryModal").classList.add("hidden"); 
        $("entryModal").classList.remove("flex"); 
      }, 200);
    }
    
    function openCalendarModal() {
      $("calendarInput").value = settings.calendarEmbedUrl || "";
      $("calendarModal").classList.remove("hidden");
      $("calendarModal").classList.add("flex");
      setTimeout(() => { $("calendarModal").firstElementChild.classList.add("scale-100", "opacity-100"); $("calendarModal").firstElementChild.classList.remove("scale-95", "opacity-0"); }, 10);
    }
    
    function closeCalendarModal() { 
      $("calendarModal").firstElementChild.classList.remove("scale-100", "opacity-100"); 
      $("calendarModal").firstElementChild.classList.add("scale-95", "opacity-0");
      setTimeout(() => {
        $("calendarModal").classList.add("hidden"); 
        $("calendarModal").classList.remove("flex"); 
      }, 200);
    }

    // Modal Initial states
    document.querySelectorAll('#entryModal > div, #calendarModal > div').forEach(el => {
      el.classList.add('scale-95', 'opacity-0');
    });

    // Event Listeners for UI
    document.querySelectorAll("[data-add-section]").forEach(btn => {
      btn.addEventListener("click", () => openEntryModal(btn.dataset.addSection));
    });

    $("openAddBtn").addEventListener("click", () => openEntryModal("deploy"));
    $("closeEntryBtn").addEventListener("click", closeEntryModal);
    $("cancelEntryBtn").addEventListener("click", closeEntryModal);
    $("entryModal").addEventListener("mousedown", (e) => { if (e.target === $("entryModal")) closeEntryModal(); });

    $("entryForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const id = $("editingId").value || crypto.randomUUID();
      const entry = {
        id,
        section: $("sectionInput").value,
        tag: $("tagInput").value.trim(),
        title: $("titleInput").value.trim(),
        subtitle: $("subtitleInput").value.trim(),
        dueDate: $("dateInput").value,
        link: $("linkInput").value.trim(),
        note: $("noteInput").value.trim()
      };

      const index = entries.findIndex(item => item.id === id);
      if (index >= 0) entries[index] = entry;
      else entries.unshift(entry);

      saveLocal();
      const ok = await saveEntryToSupabase(entry);
      if (USE_SUPABASE && !ok) return;

      closeEntryModal();
      renderAll();
    });

    $("deleteEntryBtn").addEventListener("click", async () => {
      const id = $("editingId").value;
      if (!id) return;
      const ok = await deleteEntryFromSupabase(id);
      if (USE_SUPABASE && !ok) return;

      entries = entries.filter(item => item.id !== id);
      saveLocal();
      closeEntryModal();
      renderAll();
    });

    $("openCalendarBtn").addEventListener("click", openCalendarModal);
    
    // Bind to dynamically created button
    document.addEventListener("click", (e) => {
      const calBtn = e.target.closest("#openCalendarBtn2");
      if(calBtn) openCalendarModal();
    });

    $("closeCalendarBtn").addEventListener("click", closeCalendarModal);
    $("cancelCalendarBtn").addEventListener("click", closeCalendarModal);
    $("calendarModal").addEventListener("mousedown", (e) => { if (e.target === $("calendarModal")) closeCalendarModal(); });

    $("calendarForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      settings.calendarEmbedUrl = $("calendarInput").value.trim();
      saveSettingsLocal();

      const ok = await saveSettingToSupabase("calendarEmbedUrl", settings.calendarEmbedUrl);
      if (USE_SUPABASE && !ok) return;

      closeCalendarModal();
      renderCalendar();
    });

    $("boardViewBtn").addEventListener("click", () => {
      currentView = "board";
      localStorage.setItem(VIEW_KEY, currentView);
      renderView();
    });
    $("listViewBtn").addEventListener("click", () => {
      currentView = "list";
      localStorage.setItem(VIEW_KEY, currentView);
      renderView();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        closeEntryModal();
        closeCalendarModal();
      }
    });

    // Run
    init();
  </script>
</body>
</html>
