    const seedEntries = [
      { id: crypto.randomUUID(), section: "deploy", title: "学习板块独立部署", subtitle: "从个人博物馆中拆分成独立页面", tag: "待部署", dueDate: today, link: "", note: "检查路由、日历嵌入、Supabase 表权限。" },
      { id: crypto.randomUUID(), section: "focus", title: "本周论文和网站并行整理", subtitle: "把最重要的任务放到日历中", tag: "本周", dueDate: today, link: "", note: "不做进度条，只保留清晰的任务卡片。" },
      { id: crypto.randomUUID(), section: "review", title: "复盘 Supabase 权限", subtitle: "RLS、Storage、表字段、URL 格式", tag: "复习", dueDate: "", link: "", note: "把之前遇到的问题整理成排查清单。" },
      { id: crypto.randomUUID(), section: "resource", title: "Supabase Docs", subtitle: "后续同步与权限配置入口", tag: "文档", dueDate: "", link: "https://supabase.com/docs", note: "需要时查看 JavaScript API 和 Row Level Security。" },
      { id: crypto.randomUUID(), section: "note", title: "灵感：做学习周报", subtitle: "自动从条目中汇总本周内容", tag: "想法", dueDate: "", link: "", note: "以后可以扩展成周报导出功能。" }
    ];

    let entries = [];
    let settings = { calendarEmbedUrl: "" };
    let currentView = localStorage.getItem(VIEW_KEY) || "board";
    let activeSection = "all";

    const $ = (id) => document.getElementById(id);

    function saveLocal() { localStorage.setItem(ENTRY_KEY, JSON.stringify(entries)); }
    function saveSettingsLocal() { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }
    function sectionInfo(section) { return SECTIONS[section] || { label: "未分类", icon: "layout-grid", target: "", color: "text-bauhaus-fg" }; }

    async function fetchEntriesFromSupabase() {
      if (!supabaseClient) return null;
      const { data, error } = await supabaseClient
        .from("study_entries")
        .select("id,section,title,subtitle,tag,due_date,link,note,created_at")
        .order("created_at", { ascending: false });

      if (error) return null;

      return (data || []).map(item => ({
        id: item.id, section: item.section, title: item.title, subtitle: item.subtitle,
        tag: item.tag, dueDate: item.due_date, link: item.link, note: item.note, createdAt: item.created_at
      }));
    }

    async function saveEntryToSupabase(entry) {
      if (!supabaseClient) return true;
      const payload = {
        id: entry.id, section: entry.section, title: entry.title, subtitle: entry.subtitle,
        tag: entry.tag, due_date: entry.dueDate || null, link: entry.link || null, note: entry.note || null
      };
      const { error } = await supabaseClient.from("study_entries").upsert(payload);
      if (error) { alert("保存失败：" + error.message); return false; }
      return true;
    }

    async function deleteEntryFromSupabase(id) {
      if (!supabaseClient) return true;
      const { error } = await supabaseClient.from("study_entries").delete().eq("id", id);
      if (error) { alert("删除失败：" + error.message); return false; }
      return true;
    }

    async function fetchSettingsFromSupabase() {
      if (!supabaseClient) return null;
      const { data, error } = await supabaseClient.from("app_settings").select("setting_key,setting_value");
      if (error) return null;
      const result = {};
      (data || []).forEach(item => result[item.setting_key] = item.setting_value || "");
      return result;
    }

    async function saveSettingToSupabase(key, value) {
      if (!supabaseClient) return true;
      const { error } = await supabaseClient.from("app_settings").upsert({ setting_key: key, setting_value: value });
      if (error) { alert("保存失败：" + error.message); return false; }
      return true;
    }

    async function init() {
      const cloudEntries = await fetchEntriesFromSupabase();
      const localEntries = JSON.parse(localStorage.getItem(ENTRY_KEY) || "null");
      entries = cloudEntries || localEntries || seedEntries;
      if (!cloudEntries && !localEntries) saveLocal();

      const cloudSettings = await fetchSettingsFromSupabase();
      const localSettings = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "null");
      settings = { calendarEmbedUrl: "", ...(cloudSettings || localSettings || {}) };
      if (!cloudSettings && !localSettings) saveSettingsLocal();

      renderAll();
    }

    function getFilteredEntries() {
      return entries.filter(item => {
        const hitSection = activeSection === "all" || item.section === activeSection;
        return hitSection;
      }).sort((a, b) => {
        const at = a.dueDate ? new Date(a.dueDate).getTime() : 0;
        const bt = b.dueDate ? new Date(b.dueDate).getTime() : 0;
        return (bt || 0) - (at || 0);
      });
    }

    function renderNav() {
      // Sidebar removed: keep this no-op so data rendering remains stable.
    }

    function renderCalendar() {
      const src = (settings.calendarEmbedUrl || "").trim();
      $("calendarWrap").innerHTML = src
        ? `<iframe src="${src}" loading="lazy" class="w-full h-full border-4 border-bauhaus-fg bg-white"></iframe>`
        : `<div class="w-full h-full min-h-0 flex flex-col items-center justify-center text-center p-6 border-4 border-bauhaus-fg border-dashed bg-white">
            <div class="w-16 h-16 bg-bauhaus-yellow rounded-full border-4 border-bauhaus-fg flex items-center justify-center mb-4"><i data-lucide="calendar-plus" class="w-8 h-8 stroke-[2px]"></i></div>
            <strong class="text-xl font-black uppercase mb-2">未设置日历</strong>
            <p class="font-medium max-w-sm">点击右上角齿轮图标，粘贴 Google Calendar iframe 链接。</p>
           </div>`;
    }

    function renderBoard() {
      Object.entries(SECTIONS).forEach(([key, info]) => {
        const target = $(info.target);
        const items = getFilteredEntries().filter(item => item.section === key);
        
        // Define specific styling per panel section to maintain text readability
        let cardBg = "bg-white";
        let cardText = "text-bauhaus-fg";
        if(key === "focus") { cardBg = "bg-white"; cardText = "text-bauhaus-fg"; } // Inside red panel
        if(key === "review") { cardBg = "bg-white"; cardText = "text-bauhaus-fg"; } // Inside blue panel

        target.innerHTML = items.length
          ? items.map(item => createItemCard(item, cardBg, cardText)).join("")
          : `<div class="p-6 border-4 border-dashed border-bauhaus-fg text-center font-bold uppercase tracking-wider bg-white text-bauhaus-fg bg-opacity-50">暂无条目</div>`;
      });

      bindItemActions();
    }

    function createItemCard(item, bgClass = "bg-white", textClass = "text-bauhaus-fg") {
      const sInfo = sectionInfo(item.section);
      const completeButton = item.section === "resource"
        ? ""
        : `<button class="w-8 h-8 shrink-0 border-2 border-bauhaus-fg flex items-center justify-center hover:bg-bauhaus-blue hover:text-white transition-colors" data-complete="${item.id}" title="完成">
              <i data-lucide="check" class="w-4 h-4 stroke-[3px]"></i>
            </button>`;
      return `
        <article class="${bgClass} ${textClass} border-4 border-bauhaus-fg shadow-solid-sm p-4 relative group hover:-translate-y-1 transition-transform cursor-default">
          <div class="flex justify-between items-start gap-4 mb-3">
            <div class="min-w-0">
              <h4 class="font-black text-lg leading-tight mb-1">${item.title || "未命名"}</h4>
              ${item.subtitle ? `<div class="font-medium text-sm opacity-80">${item.subtitle}</div>` : ""}
            </div>
            <div class="shrink-0 flex items-center gap-2">
              ${completeButton}
              <button class="w-8 h-8 shrink-0 border-2 border-bauhaus-fg flex items-center justify-center hover:bg-bauhaus-yellow hover:text-bauhaus-fg transition-colors" data-edit="${item.id}" title="编辑">
                <i data-lucide="edit" class="w-4 h-4 stroke-[3px]"></i>
              </button>
            </div>
          </div>
          
          <div class="flex flex-wrap gap-2 mb-3">
            <span class="inline-flex items-center gap-1.5 px-2 py-1 text-[10px] font-bold uppercase tracking-wider border-2 border-bauhaus-fg bg-bauhaus-bg text-bauhaus-fg">
              <i data-lucide="${sInfo.icon}" class="w-3 h-3 stroke-[3px] ${sInfo.color}"></i> ${sInfo.label}
            </span>
            ${item.tag ? `<span class="inline-flex items-center gap-1.5 px-2 py-1 text-[10px] font-bold uppercase tracking-wider border-2 border-bauhaus-fg bg-bauhaus-fg text-white"><i data-lucide="tag" class="w-3 h-3"></i> ${item.tag}</span>` : ""}
            ${item.dueDate ? `<span class="inline-flex items-center gap-1.5 px-2 py-1 text-[10px] font-bold uppercase tracking-wider border-2 border-bauhaus-fg bg-bauhaus-yellow text-bauhaus-fg"><i data-lucide="calendar" class="w-3 h-3"></i> ${item.dueDate}</span>` : ""}
          </div>
          
          ${item.note ? `<div class="text-sm font-medium border-l-4 border-bauhaus-fg pl-3 py-1 opacity-90">${item.note}</div>` : ""}
          ${item.link ? `<a href="${item.link}" target="_blank" rel="noopener noreferrer" class="mt-3 inline-flex items-center gap-2 text-xs font-bold uppercase tracking-widest border-b-2 border-bauhaus-fg pb-0.5 hover:text-bauhaus-red hover:border-bauhaus-red transition-colors"><i data-lucide="external-link" class="w-3 h-3 stroke-[3px]"></i> 打开链接</a>` : ""}
        </article>
      `;
    }

    function renderList() {
      const items = getFilteredEntries();
      $("listView").innerHTML = items.length
        ? items.map(item => `
          <div class="flex flex-col md:flex-row gap-4 p-4 border-4 border-bauhaus-fg bg-white shadow-solid-sm">
            <div class="w-full md:w-40 shrink-0 bg-bauhaus-fg text-white flex flex-col items-center justify-center p-4 border-4 border-bauhaus-fg relative overflow-hidden">
               <i data-lucide="${sectionInfo(item.section).icon}" class="w-8 h-8 stroke-[2px] mb-2 z-10 ${sectionInfo(item.section).color}"></i>
               <span class="font-bold uppercase tracking-wider text-xs z-10 text-center">${sectionInfo(item.section).label}</span>
            </div>
            <div class="flex-1 w-full min-w-0">
              ${createItemCard(item, "bg-transparent", "text-bauhaus-fg").replace('shadow-solid-sm p-4 relative group hover:-translate-y-1', 'p-2 border-none shadow-none')}
            </div>
          </div>
        `).join("")
        : `<div class="p-12 border-4 border-dashed border-bauhaus-fg text-center font-black uppercase text-xl bg-white shadow-solid-sm">暂无符合条件的条目</div>`;

      bindItemActions();
    }

    function bindItemActions() {
      document.querySelectorAll("[data-edit]").forEach(btn => btn.addEventListener("click", () => openEntryModal(null, btn.dataset.edit)));
      document.querySelectorAll("[data-complete]").forEach(btn => btn.addEventListener("click", () => completeEntry(btn.dataset.complete)));
    }

    async function completeEntry(id) {
      if (!id) return;
      if (!confirm("确认完成并移除这条学习记录吗？")) return;

      const ok = await deleteEntryFromSupabase(id);
      if (USE_SUPABASE && !ok) return;

      entries = entries.filter(item => item.id !== id);
      saveLocal();
      renderAll();
    }

    function renderView() {
      const isBoard = currentView === "board";

      $("boardView").classList.toggle("hidden", !isBoard);
      $("boardView").classList.toggle("grid", isBoard);

      $("listView").classList.toggle("hidden", isBoard);
      $("listView").classList.toggle("flex", !isBoard);

      $("boardViewBtn").classList.toggle("bg-bauhaus-yellow", isBoard);
      $("boardViewBtn").classList.toggle("text-bauhaus-fg", isBoard);
      $("listViewBtn").classList.toggle("bg-bauhaus-blue", !isBoard);
      $("listViewBtn").classList.toggle("text-white", !isBoard);

      renderCalendar();
      if (isBoard) renderBoard();
      else renderList();

      lucide.createIcons();
    }

    function renderAll() {
      renderNav();
      renderView();
    }

    function openEntryModal(section = "deploy", id = "") {
      const item = id ? entries.find(entry => entry.id === id) : null;
      $("entryForm").reset();
      $("editingId").value = item?.id || "";
      $("sectionInput").value = item?.section || section || "deploy";
      $("tagInput").value = item?.tag || "";
      $("titleInput").value = item?.title || "";
      $("subtitleInput").value = item?.subtitle || "";
      $("dateInput").value = item?.dueDate || "";
      $("linkInput").value = item?.link || "";
      $("noteInput").value = item?.note || "";
      
      $("entryModalTitle").innerHTML = item
        ? `<i data-lucide="edit" class="text-bauhaus-blue w-8 h-8 stroke-[3px]"></i> 编辑条目`
        : `<i data-lucide="graduation-cap" class="text-bauhaus-red w-8 h-8 stroke-[3px]"></i> 新增条目`;
      
      $("deleteEntryBtn").classList.toggle("invisible", !item);
      $("entryModal").classList.remove("hidden");
      $("entryModal").classList.add("flex");
      lucide.createIcons();
    }

    function closeEntryModal() { 
      $("entryModal").classList.add("hidden"); 
      $("entryModal").classList.remove("flex"); 
    }
    
    function openCalendarModal() {
      $("calendarInput").value = settings.calendarEmbedUrl || "";
      $("calendarModal").classList.remove("hidden");
      $("calendarModal").classList.add("flex");
      lucide.createIcons();
    }
    
    function closeCalendarModal() { 
      $("calendarModal").classList.add("hidden"); 
      $("calendarModal").classList.remove("flex"); 
    }

    document.querySelectorAll("[data-add-section]").forEach(btn => {
      btn.addEventListener("click", () => openEntryModal(btn.dataset.addSection));
    });

    $("openAddBtn").addEventListener("click", () => openEntryModal("deploy"));
    $("closeEntryBtn").addEventListener("click", closeEntryModal);
    $("cancelEntryBtn").addEventListener("click", closeEntryModal);
    $("entryModal").addEventListener("click", (e) => { if (e.target === $("entryModal")) closeEntryModal(); });

    $("entryForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const id = $("editingId").value || crypto.randomUUID();
      const entry = {
        id,
        section: $("sectionInput").value,
        tag: $("tagInput").value.trim(),
        title: $("titleInput").value.trim(),
        subtitle: $("subtitleInput").value.trim(),
        dueDate: $("dateInput").value,
        link: $("linkInput").value.trim(),
        note: $("noteInput").value.trim()
      };

      const index = entries.findIndex(item => item.id === id);
      if (index >= 0) entries[index] = entry;
      else entries.unshift(entry);

      saveLocal();
      const ok = await saveEntryToSupabase(entry);
      if (USE_SUPABASE && !ok) return;

      closeEntryModal();
      renderAll();
    });

    $("deleteEntryBtn").addEventListener("click", async () => {
      const id = $("editingId").value;
      if (!id) return;
      if (!confirm("确认删除这条学习记录吗？")) return;

      const ok = await deleteEntryFromSupabase(id);
      if (USE_SUPABASE && !ok) return;

      entries = entries.filter(item => item.id !== id);
      saveLocal();
      closeEntryModal();
      renderAll();
    });

    $("openCalendarBtn").addEventListener("click", openCalendarModal);
    $("openCalendarBtn2").addEventListener("click", openCalendarModal);
    $("closeCalendarBtn").addEventListener("click", closeCalendarModal);
    $("cancelCalendarBtn").addEventListener("click", closeCalendarModal);
    $("calendarModal").addEventListener("click", (e) => { if (e.target === $("calendarModal")) closeCalendarModal(); });

    $("calendarForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      settings.calendarEmbedUrl = $("calendarInput").value.trim();
      saveSettingsLocal();

      const ok = await saveSettingToSupabase("calendarEmbedUrl", settings.calendarEmbedUrl);
      if (USE_SUPABASE && !ok) return;

      closeCalendarModal();
      renderCalendar();
    });

    $("boardViewBtn").addEventListener("click", () => {
      currentView = "board";
      localStorage.setItem(VIEW_KEY, currentView);
      renderView();
    });
    $("listViewBtn").addEventListener("click", () => {
      currentView = "list";
      localStorage.setItem(VIEW_KEY, currentView);
      renderView();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        closeEntryModal();
        closeCalendarModal();
      }
    });

    // Initialize application
    init();
  </script>
</body>
</html>
