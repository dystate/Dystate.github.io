<script>
// 🚨🚨🚨 在这里填入你的 Supabase 钥匙 🚨🚨🚨
const SUPABASE_URL = 'https://mqlctakdtjanshgsdwal.supabase.co'; 
const SUPABASE_KEY = 'sb_publishable_mLz7oSFvfPZDFxJgApI1JA_0oE4gla1'; 
// 🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨

function initCloudLedger() {
const { createClient } = supabase;
const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const nameInput = document.getElementById('item-name');
const priceInput = document.getElementById('item-price');
const addBtn = document.getElementById('add-bill-btn');
const tbody = document.getElementById('ledger-body');
const totalSumEl = document.getElementById('total-sum');
const loadingIndicator = document.getElementById('loading-indicator');

if (!tbody) return;

// 1. 从 Supabase 拉取账单数据
async function fetchBills() {
loadingIndicator.style.display = 'block';
const { data, error } = await _supabase
.from('love_bills')
.select('*')
.order('created_at', { ascending: false }); // 最新记的账在最上面

loadingIndicator.style.display = 'none';

if (error) {
console.error('获取失败:', error);
document.getElementById('cloud-status').innerText = '云端同步失败，请刷新重试';
return;
}
renderBills(data);
}

// 2. 渲染账单列表并计算总价
function renderBills(bills) {
tbody.innerHTML = '';
let total = 0;

bills.forEach(bill => {
total += parseFloat(bill.price);

const tr = document.createElement('tr');
tr.innerHTML = `
<td class="item-name">${bill.name}</td>
<td class="item-price">¥ ${parseFloat(bill.price).toFixed(2)}</td>
<td style="text-align: center;">
<button class="delete-btn" data-id="${bill.id}" title="删除">×</button>
</td>
`;
tbody.appendChild(tr);
});

// 更新总金额
totalSumEl.innerText = total.toFixed(2);

// 绑定删除事件 (同步到云端)
document.querySelectorAll('.delete-btn').forEach(btn => {
btn.addEventListener('click', async function(e) {
e.preventDefault();
const id = this.dataset.id;

// 视觉上先移除该行
this.closest('tr').remove();

await _supabase
.from('love_bills')
.delete()
.eq('id', id);

fetchBills(); // 重新拉取以更新总金额
});
});
}

// 3. 记一笔 (上传到云端)
async function addNewBill() {
const name = nameInput.value.trim();
const price = parseFloat(priceInput.value);

if (name === '' || isNaN(price) || price <= 0) {
alert('请填写正确的物品名称和金额哦！');
return;
}

addBtn.disabled = true;
addBtn.innerText = '保存中...';

const { error } = await _supabase
.from('love_bills')
.insert([{ name: name, price: price }]);

addBtn.disabled = false;
addBtn.innerText = '记一笔';
nameInput.value = '';
priceInput.value = '';

if (!error) {
fetchBills(); // 保存成功后重新拉取
} else {
console.error('添加失败:', error);
alert("记账失败，请检查网络！");
}
}

addBtn.addEventListener('click', addNewBill);
priceInput.addEventListener('keypress', function(e) {
if (e.key === 'Enter') addNewBill();
});

// 启动！
fetchBills();
}

document.addEventListener('DOMContentLoaded', initCloudLedger);
document.addEventListener('pjax:complete', initCloudLedger);
</script></div></div><div class="aside-content" id="aside-content"><div class="sticky_layout"><div class="card-widget card-archives">
