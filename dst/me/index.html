
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态排版：蜿蜒回旋的飞行轨迹</title>
    <link href="https://fonts.googleapis.com/css2?family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #f1f5f9; 
            display: flex; justify-content: center; padding-top: 40px; 
        }
        
        #l_main { background: transparent !important; box-shadow: none !important; }
        .article-meta, .title, #l_footer { display: none !important; }
        
        .char-span {
            display: inline-block;
            transition: transform 0.42s cubic-bezier(0.16, 1, 0.3, 1),
                        opacity 0.55s ease,
                        filter 0.55s ease,
                        color 0.35s ease;
            position: relative;
            will-change: transform, opacity, filter;
        }

        .char-span.vanished {
            opacity: 0;
            filter: blur(4px);
            color: #93c5fd;
        }

        .char-span.dispersing {
            opacity: 0;
            filter: blur(5px);
            color: #93c5fd;
        }

        .bubble-dot {
            position: absolute;
            width: 7px;
            height: 7px;
            border-radius: 999px;
            border: 1.4px solid rgba(96, 165, 250, 0.72);
            background: rgba(255, 255, 255, 0.22);
            pointer-events: none;
            z-index: 6;
            transform: translate(-50%, -50%) scale(0.35);
            animation: bubblePop 0.95s ease-out forwards;
        }

        @keyframes bubblePop {
            0% {
                opacity: 0.95;
                transform: translate(-50%, -50%) scale(0.35);
                filter: blur(0px);
            }
            65% {
                opacity: 0.62;
                transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.18);
                filter: blur(0.2px);
            }
            100% {
                opacity: 0;
                transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy) - 18px)) scale(1.65);
                filter: blur(2px);
            }
        }

        #pretext-stage {
            position: relative; 
            width: 800px; 
            height: 1000px; 
            overflow: hidden; 
            border: 1px solid #e2e8f0; 
            border-radius: 12px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.08);
            
            background-color: #fdfbf7; 
            background-image: 
                linear-gradient(#e0f2fe 1px, transparent 1px), 
                linear-gradient(90deg, transparent 79px, #fca5a5 79px, #fca5a5 80px, transparent 80px); 
            background-size: 100% 44px, 100% 100%; 
        }

        #text-layer {
            position: absolute; 
            inset: 0; 
            padding: 48px 50px 40px 110px; 
            font-family: 'Zhi Mang Xing', cursive; 
            font-size: 25px; 
            color: #1e3a8a; 
            line-height: 44px; 
            text-align: justify; 
            z-index: 3;
            pointer-events: none;
        }

        /* 手绘线条蝴蝶：红蓝线稿，和信纸文字风格统一 */
        #butterfly {
            position: absolute;
            width: 82px;
            height: 82px;
            z-index: 8;
            pointer-events: auto;
            cursor: pointer;
            transform-origin: center center;
            opacity: 0.96;
            filter: drop-shadow(0 2px 3px rgba(30, 58, 138, 0.08));
            will-change: transform, opacity;
        }

        #butterfly:hover {
            opacity: 1;
            filter: drop-shadow(0 4px 7px rgba(30, 58, 138, 0.16));
        }

        .butterfly-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
            animation: butterflyFloat 1.8s ease-in-out infinite;
        }

        .red-line,
        .blue-line {
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            vector-effect: non-scaling-stroke;
        }

        .red-line {
            stroke: #df4b4b;
            stroke-width: 2.35;
        }

        .blue-line {
            stroke: #67c7ee;
            stroke-width: 2.35;
        }

        .body-line {
            stroke-width: 2.8;
        }

        .wing-left-upper,
        .wing-left-lower {
            transform-origin: 108px 110px;
            animation: flapLeft 0.55s ease-in-out infinite alternate;
        }

        .wing-right-upper {
            transform-origin: 112px 108px;
            animation: flapRight 0.55s ease-in-out infinite alternate;
        }

        .sparkles {
            opacity: 0.88;
            animation: sparkleFloat 2.4s ease-in-out infinite;
        }

        @keyframes flapLeft {
            from { transform: rotate(-4deg) translateY(0px); }
            to   { transform: rotate(5deg) translateY(-1px); }
        }

        @keyframes flapRight {
            from { transform: rotate(4deg) translateY(0px); }
            to   { transform: rotate(-5deg) translateY(-1px); }
        }

        @keyframes butterflyFloat {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-3px) scale(1.015); }
        }

        @keyframes sparkleFloat {
            0%, 100% { transform: translateY(0px); opacity: 0.75; }
            50% { transform: translateY(-2px); opacity: 1; }
        }

    </style>
</head>
<body>

    <div id="pretext-stage">
        
        <svg width="800" height="1000" style="position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1;">
            <g>
                <title>Layer 1</title>
                <path id="flight-path" fill="none" stroke="transparent" stroke-width="2" d="m19.32997,436.53329c0,0 -0.30554,-2.08264 2,-10c1.76827,-6.07233 6.17005,-15.94421 12,-34c10.3014,-31.90421 31.64052,-85.52185 61.99999,-129.99997c29.76745,-43.61076 62.07319,-80.08151 89.99999,-104c48.91614,-41.89525 85.16721,-58.33877 116,-68c25.46259,-7.97852 60.17981,-12.9324 84,-10c24.55328,3.02264 46.89847,12.22565 64,22c29.87408,17.07451 49.85785,33.85786 64,48c7.07104,7.07108 16,22 18,28c2,6 2.76538,8.15224 2,10c-1.0824,2.61313 -3.49347,8.74269 -12,14c-7.60846,4.70229 -35.93039,22.15016 -66,35.99998c-21.94974,10.10986 -47.77808,18.4568 -68,28.00002c-35.62735,16.81342 -62.13751,27.79626 -80,40c-20.15778,13.77188 -60.60251,43.27466 -80,60c-28.93808,24.95166 -59.03316,54.14331 -74,81.99997c-20.39009,37.95053 -21.40753,55.944 -19.99998,74.00003c1.77226,22.73456 18.44853,45.67322 29.99998,62c8.32986,11.77344 17.90654,20.14386 24,24c9.85443,6.23621 15.85159,6.99512 26,8c11.9416,1.18243 62.14178,-15.46912 108,-28c42.13589,-11.51373 86.29709,-21.27026 146,-46c42.21634,-17.48657 69.63831,-27.15869 100,-36.00003c15.83472,-4.61108 37.75714,-6.98691 44,-8c7.89673,-1.28146 14.34619,-0.29453 16,2c7.84473,10.88397 15.08667,34.25858 24,64.00003c9.07825,30.29169 18,64 18,86c0,23.99994 -3.41278,58.20374 -12,81.99994c-13.11133,36.33307 -26,58 -42,78c-16,20 -57.20044,63.65582 -98,92c-43.39511,30.14734 -109.52557,64.85785 -156,90c-57.43347,31.07086 -81.77527,42.50995 -104,52.00006c-9.90511,4.22949 -22,8 -24,8c-2,0 -2,0 -4,0l0,0" />
            </g>
        </svg>

        <div id="butterfly">
            <svg class="butterfly-svg" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <!-- 左上翅 -->
                <path class="red-line wing-left-upper"
                    d="M108 108 C92 88, 74 72, 48 68 C26 65, 12 78, 14 100 C16 123, 38 136, 64 136 C84 136, 97 126, 108 108 Z" />

                <!-- 左下翅 -->
                <path class="red-line wing-left-lower"
                    d="M108 110 C86 114, 66 120, 42 128 C24 134, 18 148, 22 166 C26 186, 48 194, 74 188 C96 184, 108 172, 116 156 C120 146, 118 128, 108 110 Z" />

                <!-- 右上翅 -->
                <path class="red-line wing-right-upper"
                    d="M112 108 C122 88, 132 66, 142 44 C150 26, 168 20, 182 30 C196 40, 198 66, 194 100 C190 128, 178 150, 160 158 C142 166, 126 148, 118 128 C114 120, 112 114, 112 108 Z" />

                <!-- 身体与触角 -->
                <path class="blue-line body-line"
                    d="M108 108 C114 112, 118 122, 118 136 C118 150, 112 164, 104 176 C100 182, 92 182, 88 176 C84 170, 88 156, 94 142 C100 126, 102 114, 108 108 Z" />
                <path class="blue-line" d="M106 108 C98 94, 94 78, 94 62" />
                <path class="blue-line" d="M112 108 C126 96, 136 80, 142 64" />

                <!-- 翅膀花纹 -->
                <ellipse class="red-line" cx="70" cy="92" rx="10" ry="7" />
                <ellipse class="blue-line" cx="70" cy="92" rx="5" ry="4" />
                <ellipse class="red-line" cx="88" cy="80" rx="12" ry="8" />
                <ellipse class="blue-line" cx="88" cy="80" rx="6" ry="4.5" />
                <ellipse class="red-line" cx="74" cy="150" rx="11" ry="7" />
                <ellipse class="blue-line" cx="74" cy="150" rx="5.5" ry="4" />
                <ellipse class="red-line" cx="58" cy="168" rx="13" ry="8" />
                <ellipse class="blue-line" cx="58" cy="168" rx="6" ry="4.5" />
                <ellipse class="red-line" cx="152" cy="48" rx="12" ry="9" />
                <ellipse class="blue-line" cx="152" cy="48" rx="6" ry="5" />
                <ellipse class="red-line" cx="142" cy="72" rx="10" ry="8" />
                <ellipse class="blue-line" cx="142" cy="72" rx="5" ry="4.5" />

                <!-- 少量星光装饰 -->
                <g class="sparkles">
                    <path class="blue-line" d="M170 150 L170 164 M163 157 L177 157" />
                    <path class="blue-line" d="M186 138 L186 148 M181 143 L191 143" />
                    <path class="red-line" d="M180 176 L180 188 M174 182 L186 182" />
                    <path class="red-line" d="M164 168 L170 174 L164 180 L158 174 Z" />
                    <circle class="red-line" cx="150" cy="198" r="3.5" />
                    <circle class="blue-line" cx="122" cy="198" r="3" />
                    <path class="blue-line" d="M108 188 L108 200 M102 194 L114 194" />
                    <path class="blue-line" d="M132 186 L138 192 L132 198 L126 192 Z" />
                    <circle class="red-line" cx="96" cy="198" r="3.5" />
                </g>
            </svg>
        </div>
        
        <div id="text-layer"></div>
    </div>

    <script>
        {
            const stage = document.getElementById('pretext-stage');
            const butterfly = document.getElementById('butterfly');
            const textLayer = document.getElementById('text-layer');
            const flightPath = document.getElementById('flight-path');

            const pathLength = flightPath.getTotalLength(); 
            const targetUrl = 'https://www.example.com'; // 点击蝴蝶跳转的网址：把这里改成你自己的目标网页
            butterfly.setAttribute('title', '点击跳转');
            butterfly.addEventListener('click', () => {
                window.open(targetUrl, '_blank');
            });

            // 文本内容微调
            const myText = `他不仅记得每座山的每一道山脊的每一片林木，他还记得他在某一天早晨看到的云朵的轮廓，并拿它和他在那一天晚上看到的带有斑点的云朵相比，或者拿它和他在南方的天空，在那天黎明时分看到的一片像丝绸一样的云朵相比。事实上，他是在重构这些云朵。他能把那天的火红的云、那种极度混乱的颜色重现出来。他能把神话小说中描写的高速奔驰的马，把每一次奔跑，把每一处肌肉的紧绷，把每一次呼吸，都记录在脑海里。

            他不是一个思想家，因为思想要求我们忽略差异，把相似的事物归类，并在这个归类的过程中去概括。富内斯不仅记得每一片叶子，他甚至记得叶子在某个特定时刻被阳光照射后的每一个细节。他那令人恐惧的记忆力，其实也是一种对他人的诅咒。他告诉我，他那非凡的直觉，其实是一种对现实的淤积。

            在他的脑子里，每一秒钟都在累积，每一瞬间都是一种独一无二的永恒，而这永恒是如此沉重，以至于他无法进行任何抽象的思考。我怀疑他在那一瞬间，能否像我们普通人一样，能够理解“狗”这个词，因为在他眼里，每一只狗都不仅仅是那一时刻的实体，它是他记忆中所有形态、所有动作、所有光影下的狗的集合。对于他来说，世界就像是一座堆满了无数细节的坟墓，没有任何东西是可以被遗忘的，因为没有任何东西是可以被概括的。每一个刹那都是一个无穷的宇宙，这种过度的清晰，反倒让他陷入了永恒的沉默之中。`;

            const chars = myText.split('');
            textLayer.innerHTML = '';
            const spanElements = chars.map(char => {
                const span = document.createElement('span');
                span.innerText = char;
                span.className = 'char-span';
                textLayer.appendChild(span);
                return span;
            });

            let charData = [];
            setTimeout(() => {
                charData = spanElements.map((span, index) => {
                    return {
                        el: span,
                        x: span.offsetLeft + span.offsetWidth / 2,
                        y: span.offsetTop + span.offsetHeight / 2,
                        wobble: Math.sin(index * 1.73),
                        vanished: false,
                        bubbleSeed: index * 37
                    };
                });
                requestAnimationFrame(renderLoop);
            }, 250); 

            let progress = 0; 
            let allDispersed = false;
            const speed = 0.0035; // 保持轻快滑行速度
            const dissolveRadius = 82; // 蝴蝶靠近时，文字开始像泡沫一样消失
            const rippleRadius = 120; // 外圈文字产生轻微水波变形
            const maxPush = 42;

            function createBubble(x, y, seed) {
                for (let i = 0; i < 3; i++) {
                    const bubble = document.createElement('span');
                    bubble.className = 'bubble-dot';
                    const dx = Math.sin(seed + i * 2.1) * (12 + i * 7);
                    const dy = -10 - Math.cos(seed + i * 1.7) * (10 + i * 5);
                    const size = 4 + ((seed + i) % 4);
                    bubble.style.left = `${x}px`;
                    bubble.style.top = `${y}px`;
                    bubble.style.width = `${size}px`;
                    bubble.style.height = `${size}px`;
                    bubble.style.setProperty('--dx', `${dx}px`);
                    bubble.style.setProperty('--dy', `${dy}px`);
                    bubble.style.animationDelay = `${i * 0.045}s`;
                    bubble.style.borderColor = i % 2 === 0 ? 'rgba(96, 165, 250, 0.72)' : 'rgba(223, 75, 75, 0.55)';
                    stage.appendChild(bubble);
                    setTimeout(() => bubble.remove(), 1100);
                }
            }

            function disperseRemainingText() {
                if (allDispersed) return;
                allDispersed = true;

                const centerX = stage.clientWidth / 2;
                const centerY = stage.clientHeight / 2;

                charData.forEach((char, index) => {
                    if (char.vanished) return;

                    const dx0 = char.x - centerX;
                    const dy0 = char.y - centerY;
                    const base = Math.sqrt(dx0 * dx0 + dy0 * dy0) || 1;
                    const seed = index * 0.73;
                    const drift = 95 + (index % 9) * 13;
                    const floatUp = 45 + (index % 7) * 10;
                    const scatterX = (dx0 / base) * drift + Math.sin(seed) * 62;
                    const scatterY = (dy0 / base) * drift - floatUp + Math.cos(seed * 1.4) * 36;
                    const rotate = Math.sin(seed * 2.1) * 85;
                    const skew = Math.cos(seed * 1.7) * 28;
                    const delay = Math.min(0.75, index * 0.003);

                    char.vanished = true;
                    char.el.style.transition = `transform 1.75s cubic-bezier(0.16, 1, 0.3, 1) ${delay}s, opacity 1.65s ease ${delay}s, filter 1.65s ease ${delay}s`;
                    char.el.classList.add('dispersing');
                    char.el.style.transform = `translate(${scatterX}px, ${scatterY}px) rotate(${rotate}deg) skew(${skew}deg) scale(${1.18 + (index % 5) * 0.08})`;

                    if (index % 4 === 0) {
                        setTimeout(() => createBubble(char.x, char.y, char.bubbleSeed + 99), delay * 1000);
                    }
                });
            }

            function settleButterflyAtBottom() {
                // 蝴蝶完成飞行后停在纸张底部中间，仍然可以点击跳转。
                const finalX = stage.clientWidth / 2 - 41;
                const finalY = stage.clientHeight - 118;
                butterfly.style.transition = 'transform 1.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.7s ease, filter 0.7s ease';
                butterfly.style.transform = `translate(${finalX}px, ${finalY}px) rotate(-8deg)`;
                butterfly.style.opacity = '1';
                butterfly.style.pointerEvents = 'auto';
            }

            function renderLoop() {
                progress += speed;
                let isFinished = false;

                if (progress >= 1) {
                    progress = 1;
                    isFinished = true;
                }

                const currentPoint = flightPath.getPointAtLength(progress * pathLength);
                const nextPoint = flightPath.getPointAtLength(Math.min(progress * pathLength + 5, pathLength));
                const bx = currentPoint.x;
                const by = currentPoint.y;
                const angle = Math.atan2(nextPoint.y - by, nextPoint.x - bx) * 180 / Math.PI;
                
                butterfly.style.transform = `translate(${bx - 41}px, ${by - 41}px) rotate(${angle}deg)`;

                charData.forEach(char => {
                    const dx = char.x - bx;
                    const dy = char.y - by;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (char.vanished) return;

                    if (distance < dissolveRadius && distance > 0) {
                        const force = Math.pow((dissolveRadius - distance) / dissolveRadius, 0.72);
                        const awayX = (dx / distance) * force * maxPush;
                        const awayY = (dy / distance) * force * maxPush - force * 22;
                        const twist = char.wobble * force * 34;
                        const skew = char.wobble * force * 20;

                        // 经过蝴蝶附近的文字不再恢复，而是像泡沫一样被吹散、变淡、消失
                        char.vanished = true;
                        char.el.classList.add('vanished');
                        char.el.style.transform = `translate(${awayX}px, ${awayY}px) rotate(${twist}deg) skew(${skew}deg) scale(${1 + force * 0.95})`;
                        createBubble(char.x, char.y, char.bubbleSeed);
                    } else if (distance < rippleRadius && distance > 0) {
                        const force = Math.pow((rippleRadius - distance) / rippleRadius, 1.45);
                        const pushX = (dx / distance) * force * 18;
                        const pushY = (dy / distance) * force * 18;
                        const twist = char.wobble * force * 12;
                        const skew = char.wobble * force * 8;

                        // 外圈文字先产生柔和扭曲，等蝴蝶靠近后再泡沫化消失
                        char.el.style.transform = `translate(${pushX}px, ${pushY}px) rotate(${twist}deg) skew(${skew}deg) scale(${1 + force * 0.12}, ${1 - force * 0.08})`;
                        char.el.style.color = '#60a5fa';
                    } else {
                        char.el.style.transform = `translate(0px, 0px) rotate(0deg) skew(0deg) scale(1, 1)`;
                        char.el.style.color = '';
                    }
                });

                if (!isFinished) {
                    requestAnimationFrame(renderLoop);
                } else {
                    // 到达终点后，剩余没有碰到的文字也会向外飘散，随后蝴蝶停在纸张底部。
                    disperseRemainingText();
                    settleButterflyAtBottom();
                }
            }
        }
    </script>
</body>
</html>
