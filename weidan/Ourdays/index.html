  /* ====== 1. 整体容器 ====== */
  .kafka-env-wrapper {
    position: relative;
    width: 320px;
    height: 220px;
    /* 顶部预留 140px 的空间，防止信纸抽出来时被挡住 */
    margin: 140px auto 60px; 
    font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', sans-serif;
    -webkit-tap-highlight-color: transparent; 
  }

  /* 🌟 核心魔法：隐藏的开关，用来记录信封是开还是关 */
  #kafka-toggle {
    display: none;
  }

  /* ====== 2. 信封主体（变成了一个巨大的按钮） ====== */
  .k-envelope {
    position: relative;
    width: 100%;
    height: 100%;
    background: #ffffff;
    border-radius: 6px;
    box-shadow: 0 15px 40px rgba(158, 149, 179, 0.25);
    cursor: pointer;
    display: block; /* 保证点击区域铺满 */
  }

  /* ====== 3. 内部信纸 ====== */
  .k-letter {
    position: absolute;
    left: 15px;
    right: 15px;
    bottom: 15px;
    height: 195px; /* 稍微加高了一点信纸 */
    background: #fafafa;
    border-radius: 4px;
    box-shadow: 0 0 10px rgba(0,0,0,0.03);
    padding: 25px 20px;
    z-index: 2;
    transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    border: 1px solid #f0f0f0;
    box-sizing: border-box;
  }
  
  .k-letter-title {
    font-size: 16px;
    color: #555;
    margin-bottom: 10px;
    font-weight: bold;
    border-bottom: 1px dashed #dcdcdc;
    padding-bottom: 8px;
  }
  .k-letter-content {
    font-size: 14px;
    color: #777;
    line-height: 1.8;
  }

  /* ====== 4. 信封正面：左右折翼 ====== */
  .k-side-flaps {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 3;
    clip-path: polygon(0 0, 50% 50%, 100% 0, 100% 100%, 0 100%);
    background: #978caa; 
    border-radius: 6px;
  }

  /* ====== 5. 信封正面：底部折翼 ====== */
  .k-bottom-flap {
    position: absolute;
    bottom: 0; left: 0; width: 100%; height: 60%;
    z-index: 4;
    clip-path: polygon(0 100%, 50% 0, 100% 100%);
    background: #a397b8; 
    border-radius: 0 0 6px 6px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 15px;
  }
  
  .k-brand-text {
    color: #ffffff;
    font-family: 'Georgia', serif;
    font-style: italic;
    font-size: 14px;
    letter-spacing: 2px;
    opacity: 0.85;
  }

  /* ====== 6. 顶部封口 ====== */
  .k-top-flap {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 62%;
    z-index: 5;
    transform-origin: top;
    /* 关上时的动画，稍微延迟 z-index 变化，防止穿模 */
    transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), z-index 0s 0.4s;
    transform-style: preserve-3d; 
  }
  
  .k-top-flap-front {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #ab9ec1;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    border-radius: 6px 6px 0 0;
    backface-visibility: hidden; 
  }
  
  .k-top-flap-back {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #ffffff;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    border-radius: 6px 6px 0 0;
    transform: rotateX(180deg); 
    backface-visibility: hidden;
  }

  /* 呼吸闪烁的“点击”提示 */
  .k-click-hint {
    position: absolute;
    bottom: -35px;
    width: 100%;
    text-align: center;
    color: #a397b8;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
    animation: pulseHint 2s infinite;
  }
  @keyframes pulseHint {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }

  /* ====== 7. 🌟 点击后的交互状态 ====== */
  /* 点击后：打开封口并躲到信纸后面 */
  #kafka-toggle:checked ~ .k-envelope .k-top-flap {
    transform: rotateX(180deg);
    z-index: 1; 
    transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), z-index 0s 0.2s;
  }
  
  /* 点击后：信纸大幅度抽出 */
  #kafka-toggle:checked ~ .k-envelope .k-letter {
    transform: translateY(-135px); /* 向上抽出 135px */
  }
  
  /* 点击后：隐藏提示文字 */
  #kafka-toggle:checked ~ .k-envelope .k-click-hint {
    display: none;
  }
</style>
