<script>
  // ==========================================
  // 📝 贴纸数据仓库 
  // ==========================================
  const myStickers = {
    // 请在这里修改你的文字和链接，如果不想要链接，可以直接把 link 后面的内容留空，或者改成 "javascript:;"
    "2026-02-09": { text: "确定心意", link: "/weidan/Ourdays/2.9/" },
    "2026-03-20": { text: "第一次告白", link: "/weidan/Ourdays/3.20/" }
  };

  function buildSuperCalendar() {
    const container = document.getElementById('super-calendar-container');
    const indexContainer = document.getElementById('calendar-index');
    if (!container || !indexContainer) return;
    
    container.innerHTML = '';
    indexContainer.innerHTML = '';

    const startYear = 2026;
    const startMonth = 1; // 1 代表 2月 (JS中月份从0开始算)
    const totalMonths = 32; // 顺延32个月

    let indexHtml = '';
    let calHtml = '';

    for (let i = 0; i < totalMonths; i++) {
      const year = startYear + Math.floor((startMonth + i) / 12);
      const month = (startMonth + i) % 12;
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const firstDay = new Date(year, month, 1).getDay(); 

      const monthId = `month-${year}-${month + 1}`;
      const monthTitle = `${year}年 ${month + 1}月`;

      indexHtml += `<a href="#${monthId}" class="cal-index-btn">${monthTitle}</a>`;

      calHtml += `<div class="my-cal-month" id="${monthId}">`;
      calHtml += `<div class="my-cal-header">${monthTitle}</div>`;
      calHtml += `<div class="my-cal-grid">
                <div class="my-cal-weekday">日</div><div class="my-cal-weekday">一</div><div class="my-cal-weekday">二</div>
                <div class="my-cal-weekday">三</div><div class="my-cal-weekday">四</div><div class="my-cal-weekday">五</div><div class="my-cal-weekday">六</div>`;

      for (let j = 0; j < firstDay; j++) {
        calHtml += `<div class="my-cal-day empty"></div>`;
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        
        const stickerData = myStickers[dateStr]; 
        let stickerHtml = '';
        
        if (stickerData) {
          const isObject = typeof stickerData === 'object';
          const text = isObject ? stickerData.text : stickerData;
          const link = isObject && stickerData.link ? stickerData.link : 'javascript:;';
          const cursorStyle = link !== 'javascript:;' ? 'cursor: pointer;' : 'cursor: default;';

          stickerHtml = `<a href="${link}" class="my-cal-sticker" title="${text}" style="${cursorStyle}">${text}</a>`;
        }

        calHtml += `<div class="my-cal-day">
                  <span class="day-num">${day}</span>
                  ${stickerHtml}
                 </div>`;
      }
      calHtml += `</div></div>`; 
    }

    indexContainer.innerHTML = indexHtml;
    container.innerHTML = calHtml;
  }

  document.addEventListener('DOMContentLoaded', buildSuperCalendar);
  document.addEventListener('pjax:complete', buildSuperCalendar);
