<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        /* =========================================
           基础样式重置
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            /* 推荐使用无衬线字体，类似图片里的性冷淡风 */
            font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", sans-serif;
            overflow: hidden; /* 防止页面出现多余的滚动条 */
            color: #000; /* 文字颜色，如果你背景是暗色，可以改成 #fff */
        }
        /* =========================================
           背景图层（在这里换成你设计的背景）
           ========================================= */
        .background-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1; /* 保证背景永远在最底层 */
            /* 👇👇👇 在这里替换你的背景图链接 👇👇👇 */
            background-image: url('/image/weidan.png'); 
            /* 👆👆👆 如果你想用纯色背景，可以直接删掉上一行，加上 background-color: #f5f5f5; */
            background-size: cover; /* 让背景图铺满全屏 */
            background-position: center;
            background-repeat: no-repeat;
        }
        /* =========================================
           左侧导航栏
           ========================================= */
        .sidebar {
            position: absolute;
            top: 80px;  /* 距离顶部的距离 */
            left: 60px; /* 距离左侧的距离 */
            display: flex;
            flex-direction: column;
            gap: 40px; /* 标题、菜单组、底部组之间的间距 */
        }
        .site-title {
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase; /* 字母全大写 */
        }
        .nav-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px; /* 每个链接之间的间距 */
        }
        .nav-menu li a {
            text-decoration: none;
            color: inherit;
            font-size: 13px;
            position: relative;
            transition: opacity 0.3s ease;
        }
        /* 鼠标悬停特效：文字变淡并加下划线 */
        .nav-menu li a:hover {
            opacity: 0.5;
            text-decoration: underline;
            text-underline-offset: 4px;
        }
        /* 手机端适配：屏幕变小时，调整边距 */
        @media screen and (max-width: 768px) {
            .sidebar {
                top: 40px;
                left: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="background-layer"></div>
    <nav class="sidebar">
        <div class="site-title">WEI XING ZHEN</div>
        <ul class="nav-menu">
            <li><a href="/weidan/Ourdays">纪念日</a></li>
            <li><a href="/weidan/todos">一起做的事</a></li>
            <li><a href="/weidan/gallery">照片展</a></li>
            <li><a href="/weidan/shopping">购物清单（未来）</a></li>
        </ul>
    </nav>

</body>
</html>
