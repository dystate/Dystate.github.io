
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洛克王国异色奇遇记录器</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
        /* 强制解除 Volantis 的各种特效和限制 */
        #l_main { 
            background: transparent !important; 
            box-shadow: none !important; 
            padding: 0 !important; 
            width: 100% !important; 
            max-width: 100% !important;
            filter: none !important; 
            transform: none !important; 
            opacity: 1 !important; 
        }
        .l_body .container { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
        .article-meta, .title, #l_footer { display: none !important; }
    </style>
</head>
<body>
    <div id="roco-tracker-app" class="max-w-5xl mx-auto p-4 pb-20 mt-8">
        <h1 class="text-3xl font-black text-center text-gray-800 mb-8 tracking-wider">洛克王国异色记录 <span class="text-blue-500">S2赛季</span></h1>
        
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 mb-8">
            <h2 class="text-lg font-bold text-gray-700 mb-3 flex items-center gap-2">
                <svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path></svg>
                Supabase 云端同步
            </h2>
            <div class="flex items-center gap-3 mb-4">
                <input v-model="syncId" type="text" placeholder="设置你的专属同步暗号 (如: my-roco-666)" class="flex-1 p-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-400 transition-all font-mono">
            </div>
            <div class="flex gap-3">
                <button @click="uploadToCloud" :disabled="isLoading" class="flex-1 flex justify-center items-center gap-2 bg-gradient-to-r from-blue-500 to-blue-600 text-white py-2.5 rounded-xl font-bold shadow-md hover:shadow-lg transition-all active:scale-95 disabled:opacity-50">
                    <span v-if="!isLoading">⬆️ 备份到云端</span>
                    <span v-else>正在上传...</span>
                </button>
                <button @click="downloadFromCloud" :disabled="isLoading" class="flex-1 flex justify-center items-center gap-2 bg-gradient-to-r from-emerald-400 to-emerald-500 text-white py-2.5 rounded-xl font-bold shadow-md hover:shadow-lg transition-all active:scale-95 disabled:opacity-50">
                    <span v-if="!isLoading">⬇️ 从云端恢复</span>
                    <span v-else>正在拉取...</span>
                </button>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 mb-8">
            <h2 class="text-xl font-bold text-gray-800 border-l-4 border-amber-500 pl-3 mb-5">异色出货历史登记</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">获得精灵</label>
                    <select v-model="logForm.petName" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-amber-400 text-sm font-medium text-gray-700">
                        <option value="">-- 请选择精灵 --</option>
                        <option v-for="pet in pets" :value="pet.name">{{ pet.name }}</option>
                        <option value="其他异色">其他异色精灵</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">出货时的保底抽数</label>
                    <input v-model.number="logForm.count" type="number" min="0" placeholder="例如: 45" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-amber-400 text-sm font-semibold">
                </div>
                <div class="flex items-end">
                    <button @click="addShinyLog" class="w-full bg-gradient-to-r from-amber-400 to-amber-500 text-white font-bold py-2.5 rounded-xl shadow-md hover:shadow-lg active:scale-95 transition-all text-sm">
                        ➕ 登记出货历史
                    </button>
                </div>
            </div>
            <div v-if="shinyLogs.length > 0" class="mt-5 border-t border-gray-100 pt-4">
                <div class="text-xs font-bold text-gray-400 mb-3 tracking-wider uppercase">欧气/非酋历史长廊</div>
                <div class="max-h-60 overflow-y-auto space-y-2 pr-1">
                    <div v-for="(log, idx) in shinyLogs" :key="log.id" class="flex justify-between items-center bg-gray-50 px-4 py-2.5 rounded-xl border border-gray-100 text-sm animate-fade-in">
                        <div class="flex items-center gap-2 flex-wrap">
                            <span class="text-xs font-mono text-gray-400 bg-gray-200/60 px-1.5 py-0.5 rounded">{{ log.date }}</span>
                            <span class="font-bold text-gray-800">获得了 <span class="text-blue-600">{{ log.petName }}</span></span>
                            <span class="text-xs font-black text-purple-600 bg-purple-50 px-2 py-0.5 rounded-md border border-purple-100">保底计数: {{ log.count }} 抽</span>
                        </div>
                        <button @click="deleteShinyLog(idx)" class="text-red-400 hover:text-red-600 text-xs font-bold px-2 py-1 rounded hover:bg-red-50 transition-colors">
                            删除
                        </button>
                    </div>
                </div>
            </div>
            <div v-else class="text-center text-sm text-gray-400 py-4 italic">
                暂无登记记录，点击上方按钮为你的异色奇遇留下印记吧！✨
            </div>
        </div>

        <div class="mb-10">
            <h2 class="text-xl font-bold text-gray-800 border-l-4 border-blue-500 pl-3 mb-5">异色精灵图鉴 (满80自动清零)</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
                <div v-for="(pet, index) in pets" :key="index" 
                     class="bg-white rounded-2xl shadow-sm border border-gray-100 p-3 flex flex-col items-center justify-between hover:border-blue-300 transition-colors">
                    
                    <div class="text-center w-full cursor-pointer active:scale-95 transition-transform" @click="addPetCount(index)">
                        <div class="text-md font-bold text-gray-800 mb-2">{{ pet.name }}</div>
                        <div class="flex justify-center flex-wrap gap-1 mb-2">
                            <span v-for="type in pet.types" class="text-xs px-2 py-0.5 bg-gray-100 text-gray-600 rounded-md border border-gray-200">
                                {{ type }}
                            </span>
                        </div>
                        <div class="mt-1 mb-2 text-4xl font-black text-blue-600">
                            {{ pet.count }}
                        </div>
                    </div>
                    
                    <div class="flex gap-2 w-full mt-auto pt-2 border-t border-gray-50">
                        <button @click.stop="minusPetCount(index)" class="flex-1 py-1 text-xs font-bold bg-gray-50 border border-gray-200 hover:bg-gray-100 text-gray-600 rounded-lg active:scale-95 transition-transform">-1</button>
                        <button @click.stop="clearPetCount(index)" class="flex-1 py-1 text-xs font-bold bg-red-50 border border-red-100 hover:bg-red-100 text-red-500 rounded-lg active:scale-95 transition-transform">清零</button>
                    </div>
                </div>
            </div>
        </div>

        <div>
            <h2 class="text-xl font-bold text-gray-800 border-l-4 border-purple-500 pl-3 mb-5">保底池监控 (满80自动清零)</h2>
            
            <div class="mb-5">
                <div class="bg-gradient-to-br from-purple-500 to-indigo-600 rounded-2xl p-6 text-white text-center shadow-lg relative overflow-hidden group">
                    <div @click="addNormalPool" class="cursor-pointer active:scale-95 transition-transform">
                        <div class="text-sm opacity-90 font-bold mb-1 tracking-widest">🔮 普通池计数 (点击+1)</div>
                        <div class="text-6xl font-black mt-2">{{ pools.normal }}</div>
                    </div>
                    <div class="absolute top-4 right-4 flex gap-2">
                        <button @click.stop="minusNormalPool" class="px-3 py-1.5 text-xs font-bold bg-white/20 hover:bg-white/30 text-white rounded-lg backdrop-blur-sm transition-all active:scale-95">-1</button>
                        <button @click.stop="clearNormalPool" class="px-3 py-1.5 text-xs font-bold bg-red-500/50 hover:bg-red-500/70 text-white rounded-lg backdrop-blur-sm transition-all active:scale-95">清空</button>
                    </div>
                </div>
            </div>
            
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
                <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3">
                    <div v-for="type in elementTypes" :key="type" 
                         class="bg-gray-50 p-3 rounded-xl border border-gray-200 hover:border-blue-400 hover:bg-blue-50 transition-colors flex flex-col justify-between">
                        <div class="flex justify-between items-center cursor-pointer active:scale-95 transition-transform mb-3" @click="addElementPool(type)">
                            <span class="text-sm font-bold text-gray-600">{{ type }}</span>
                            <span class="font-black text-2xl text-blue-600">{{ pools.elements[type] }}</span>
                        </div>
                        <div class="flex gap-2">
                            <button @click.stop="minusElementPool(type)" class="flex-1 py-1 text-xs font-bold bg-white border border-gray-200 hover:bg-gray-100 text-gray-600 rounded-lg active:scale-95 transition-transform">-1</button>
                            <button @click.stop="clearElementPool(type)" class="flex-1 py-1 text-xs font-bold bg-white border border-red-100 hover:bg-red-50 text-red-500 rounded-lg active:scale-95 transition-transform">清零</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="text-center mt-12">
            <button @click="resetData" class="text-red-400 text-sm font-medium hover:text-red-600 px-4 py-2 rounded-lg hover:bg-red-50 transition-colors">
                ⚠️ 清空所有本地记录
            </button>
        </div>
    </div>
    
    <script>
        {
            const SUPABASE_URL = 'https://ebcdgnfpwmtnlgfjzspw.supabase.co';
            const SUPABASE_KEY = 'sb_publishable_81HGJMUvA2GnwR6u3KMPCw__HEytflU';
            
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            // 引入 computed 用于计算总和
            const { createApp, ref, computed, watch, onMounted } = Vue;
            
            createApp({
                setup() {
                    const elementTypes = ['普通','草','火','水','光','地','冰','龙','电','毒','虫','武','翼','萌','幽','恶','机械','幻'];
                    const defaultPets = [
                        { name: '嘟嘟煲', types: ['毒'], count: 0 },
                        { name: '幽影树', types: ['幽','草'], count: 0 },
                        { name: '恶魔叮', types: ['恶', '翼'], count: 0 },
                        { name: '菊花梨', types: ['萌'], count: 0 },
                        { name: '公平鸽', types: ['普通'], count: 0 },
                        { name: '灵狐', types: ['火', '冰'], count: 0 },
                        { name: '小夜', types: ['恶'], count: 0 },
                        { name: '小独角兽', types: ['光'], count: 0 },
                        { name: '小丑公爵', types: ['恶'], count: 0 },
                        { name: '小鼓象', types: ['机械'], count: 0 },
                        { name: '音碟吼', types: ['普通', '机械'], count: 0 },
                        { name: '烟花伯爵', types: ['火', '毒'], count: 0 },
                        { name: '帅帅魔偶', types: ['幻'], count: 0 },
                        { name: '炫光迪迪', types: ['光', '电'], count: 0 },
                        { name: '加油海葵', types: ['水', '萌'], count: 0 },
                        { name: '咕德帽帽', types: ['幽'], count: 0 },
                        { name: '爆炎喷喷', types: ['火', '龙'], count: 0 },
                        { name: '雪怪', types: ['冰'], count: 0 },
                    ];
                    
                    const defaultPools = {
                        normal: 0,
                        elements: elementTypes.reduce((acc, curr) => { acc[curr] = 0; return acc; }, {})
                    };
                    
                    const pets = ref(JSON.parse(JSON.stringify(defaultPets)));
                    const pools = ref(JSON.parse(JSON.stringify(defaultPools)));
                    const shinyLogs = ref([]); 
                    const syncId = ref(''); 
                    const isLoading = ref(false);
                    
                    const logForm = ref({ petName: '', count: null });
                    
                    const safeSetStorage = (key, val) => {
                        try { localStorage.setItem(key, val); } catch (e) { console.warn("浏览器拦截了存储", e); }
                    };

                    // 🌟 计算属性：实时计算总捕捉数
                    const totalCaptures = computed(() => {
                        return pets.value.reduce((sum, pet) => sum + pet.count, 0);
                    });

                    // 🌟 辅助函数：判断是否到达 80，到达则直接归 0，否则加 1
                    const checkReset = (currentValue) => {
                        return (currentValue + 1) >= 80 ? 0 : (currentValue + 1);
                    };

                    // ====== 精灵图鉴操作 ======
                    const addPetCount = (index) => {
                        pets.value[index].count = checkReset(pets.value[index].count);
                    };
                    const minusPetCount = (index) => {
                        if (pets.value[index].count > 0) pets.value[index].count--;
                    };
                    const clearPetCount = (index) => {
                        pets.value[index].count = 0;
                    };

                    // ====== 普通池操作 ======
                    const addNormalPool = () => {
                        pools.value.normal = checkReset(pools.value.normal);
                    };
                    const minusNormalPool = () => {
                        if (pools.value.normal > 0) pools.value.normal--;
                    };
                    const clearNormalPool = () => {
                        pools.value.normal = 0;
                    };

                    // ====== 系别池操作 ======
                    const addElementPool = (type) => {
                        pools.value.elements[type] = checkReset(pools.value.elements[type]);
                    };
                    const minusElementPool = (type) => {
                        if (pools.value.elements[type] > 0) pools.value.elements[type]--;
                    };
                    const clearElementPool = (type) => {
                        pools.value.elements[type] = 0;
                    };

                    // ====== 出货登记 ======
                    const addShinyLog = () => {
                        if (!logForm.value.petName) return alert('⚠️ 请选择获得的精灵！');
                        if (logForm.value.count === null || logForm.value.count === '') return alert('⚠️ 请填写出货时的保底抽数！');
                        const now = new Date();
                        const dateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
                        shinyLogs.value.unshift({
                            id: Date.now(),
                            date: dateStr,
                            petName: logForm.value.petName,
                            count: logForm.value.count
                        });
                        logForm.value.petName = '';
                        logForm.value.count = null;
                    };
                    
                    const deleteShinyLog = (index) => {
                        if (confirm('确定要删除这条出货记录吗？')) {
                            shinyLogs.value.splice(index, 1);
                        }
                    };
                    
                    // 监听与持久化
                    watch(pets, (newVal) => safeSetStorage('roco_pets_s2', JSON.stringify(newVal)), { deep: true });
                    watch(pools, (newVal) => safeSetStorage('roco_pools_s2', JSON.stringify(newVal)), { deep: true });
                    watch(shinyLogs, (newVal) => safeSetStorage('roco_logs_s2', JSON.stringify(newVal)), { deep: true }); 
                    watch(syncId, (newVal) => safeSetStorage('roco_sync_id', newVal));
                    
                    onMounted(() => {
                        try {
                            const savedPets = localStorage.getItem('roco_pets_s2');
                            const savedPools = localStorage.getItem('roco_pools_s2');
                            const savedLogs = localStorage.getItem('roco_logs_s2'); 
                            const savedSyncId = localStorage.getItem('roco_sync_id');
                            if (savedPets) pets.value = JSON.parse(savedPets);
                            if (savedPools) {
                                const parsedPools = JSON.parse(savedPools);
                                pools.value.normal = parsedPools.normal || 0;
                                pools.value.elements = parsedPools.elements || defaultPools.elements;
                            }
                            if (savedLogs) shinyLogs.value = JSON.parse(savedLogs);
                            if (savedSyncId) syncId.value = savedSyncId;
                        } catch (e) { console.warn("读取存储被拦截", e); }
                    });
                    
                    const uploadToCloud = async () => {
                        if (!syncId.value.trim()) return alert('⚠️ 请先设置一个同步暗号！');
                        isLoading.value = true;
                        try {
                            const { error } = await supabase
                                .from('roco_sync')
                                .upsert({ 
                                    sync_id: syncId.value.trim(), 
                                    pets: pets.value, 
                                    pools: pools.value,
                                    logs: shinyLogs.value, 
                                    updated_at: new Date()
                                });
                            if (error) throw error;
                            alert('✅ 成功备份到云端数据库（包含出货记录）！');
                        } catch (error) {
                            alert('❌ 上传失败: ' + error.message);
                        } finally {
                            isLoading.value = false;
                        }
                    };
                    
                    const downloadFromCloud = async () => {
                        if (!syncId.value.trim()) return alert('⚠️ 请输入你要恢复的同步暗号！');
                        isLoading.value = true;
                        try {
                            const { data, error } = await supabase
                                .from('roco_sync')
                                .select('*')
                                .eq('sync_id', syncId.value.trim())
                                .single(); 
                            if (error) throw error;
                            if (data) {
                                pets.value = data.pets;
                                pools.value.normal = data.pools.normal || 0;
                                pools.value.elements = data.pools.elements || defaultPools.elements;
                                shinyLogs.value = data.logs || []; 
                                alert('🎉 成功从云端拉取全量数据并覆盖本地！');
                            }
                        } catch (error) {
                            if (error.code === 'PGRST116') {
                                alert('☁️ 云端未找到该暗号的数据，请检查暗号是否输入正确。');
                            } else {
                                alert('❌ 下载失败: ' + error.message);
                            }
                        } finally {
                            isLoading.value = false;
                        }
                    };
                    
                    const resetData = () => {
                        if (confirm('🚨 确定清空这台设备上的所有本地记录（包含出货历史）？')) {
                            pets.value = JSON.parse(JSON.stringify(defaultPets));
                            pools.value = JSON.parse(JSON.stringify(defaultPools));
                            shinyLogs.value = [];
                            try {
                                localStorage.removeItem('roco_pets_s2');
                                localStorage.removeItem('roco_pools_s2');
                                localStorage.removeItem('roco_logs_s2');
                            } catch (e) {}
                        }
                    };
                    
                    return { 
                        pets, pools, elementTypes, shinyLogs, logForm, syncId, isLoading, totalCaptures, 
                        addPetCount, minusPetCount, clearPetCount,
                        addNormalPool, minusNormalPool, clearNormalPool,
                        addElementPool, minusElementPool, clearElementPool,
                        addShinyLog, deleteShinyLog, uploadToCloud, downloadFromCloud, resetData 
                    };
                }
            }).mount('#roco-tracker-app');
        } 
    </script>
</body>
</html>
