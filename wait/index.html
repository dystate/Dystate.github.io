<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>占星骰子 · 问题专属解析</title>
    <style>
        :root {
            --volantis-bg: #f4f4f6;
            --volantis-card: #ffffff;
            --volantis-text: #4c4c4c;
            --volantis-accent: #a370f7;
            --volantis-shadow: rgba(0, 0, 0, 0.05);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --volantis-bg: #1a1a1a;
                --volantis-card: #232324;
                --volantis-text: #c2c2c2;
                --volantis-accent: #b388ff;
                --volantis-shadow: rgba(0, 0, 0, 0.3);
            }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--volantis-bg);
            color: var(--volantis-text);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: var(--volantis-card);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px var(--volantis-shadow);
            text-align: center;
            box-sizing: border-box;
        }
        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(0,0,0,0.08);
            padding-bottom: 15px;
        }
        .btn-home {
            color: var(--volantis-accent);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
        }
        .btn-home:hover { opacity: 0.8; }
        h2 { margin: 0; font-size: 1.4rem; color: var(--volantis-accent); }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1.5px solid rgba(0,0,0,0.1);
            background: var(--volantis-bg);
            color: var(--volantis-text);
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s ease;
        }
        .input-group input:focus {
            border-color: var(--volantis-accent);
        }
        .dice-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin: 20px 0;
        }
        .dice {
            flex: 1;
            background: var(--volantis-bg);
            border: 1.5px solid rgba(0,0,0,0.05);
            border-radius: 12px;
            padding: 18px 8px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: transform 0.1s ease;
        }
        .dice.shake {
            animation: shakeAnim 0.4s ease-in-out infinite;
        }
        @keyframes shakeAnim {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-4px) rotate(-3deg); }
            75% { transform: translateY(4px) rotate(3deg); }
        }
        .dice-label {
            font-size: 0.75rem;
            font-weight: normal;
            opacity: 0.6;
            margin-bottom: 6px;
            display: block;
        }
        .btn-group { margin-top: 15px; }
        button {
            background: var(--volantis-accent);
            color: #fff;
            border: none;
            padding: 10px 24px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin: 0 6px;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-save { background: #4caf50; display: none; }
        .result-box {
            background: var(--volantis-bg);
            padding: 16px;
            border-radius: 10px;
            margin-top: 25px;
            text-align: left;
            display: none;
            border-left: 4px solid var(--volantis-accent);
        }
        .result-box strong { font-size: 0.9rem; color: var(--volantis-accent); }
        .result-box p { margin: 8px 0 0 0; font-size: 0.9rem; line-height: 1.6; }
        .stats-box {
            margin-top: 30px;
            border-top: 1px dashed rgba(0,0,0,0.1);
            padding-top: 20px;
            text-align: left;
        }
        .stats-box strong { font-size: 0.9rem; opacity: 0.8; }
        .stats-list { font-size: 0.85rem; margin-top: 10px; opacity: 0.7; }
        .stats-item { margin: 6px 0; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-header">
        <a href="/" class="btn-home">↩ 返回主页</a>
        <h2>占星微观骰子</h2>
        <div style="width: 70px;"></div>
    </div>
    <div class="input-group">
        <input type="text" id="user-question" placeholder="请在此输入你心中的问题（选填）..." maxlength="15">
    </div>
    <div class="dice-row">
        <div class="dice" id="planet"><span class="dice-label">行星</span>？</div>
        <div class="dice" id="sign"><span class="dice-label">星座</span>？</div>
        <div class="dice" id="house"><span class="dice-label">宫位</span>？</div>
    </div>
    <div class="btn-group">
        <button onclick="rollDice()">掷骰子</button>
        <button class="btn-save" id="btn-save" onclick="saveResult()">保存此卦象</button>
    </div>
    <div class="result-box" id="result-box">
        <strong>✨ 专属极简解析</strong>
        <p id="ai-reading">正在感知星象...</p>
    </div>
    <div class="stats-box">
        <strong>📊 我的高频共鸣卦象 (Top 3)</strong>
        <div id="stats-list" class="stats-list">暂无记录</div>
    </div>
</div>

<script>
    const pool = {
        planets: ["太阳","月亮","水星","金星","火星","木星","土星","天王星","海王星","冥王星","北交点","南交点"],
        signs: ["白羊","金牛","双子","巨蟹","狮子","处女","天秤","天蝎","射手","摩羯","水瓶","双鱼"],
        houses: ["1宫","2宫","3宫","4宫","5宫","6宫","7宫","8宫","9宫","10宫","11宫","12宫"]
    };

    const dict = {
        "太阳": "明朗显化", "月亮": "内心情绪", "水星": "交流思考", "金星": "价值感官", "火星": "积极出击", "木星": "幸运扩张", "土星": "承受压力", "天王星": "意外求变", "海王星": "迷茫感性", "冥王星": "执念转化", "北交点": "迈向未来", "南交点": "执着过去",
        "白羊": "冲动直接", "金牛": "务实沉稳", "双子": "多变灵活", "巨蟹": "敏感防卫", "狮子": "自信高调", "处女": "严谨细腻", "天秤": "纠结权衡", "天蝎": "深刻强烈", "射手": "自由豁达", "摩羯": "克制功利", "水瓶": "理性抽离", "双鱼": "梦幻包容",
        "1宫": "自身状态", "2宫": "资源财富", "3宫": "沟通学习", "4宫": "内心安全", "5宫": "恋爱创意", "6宫": "琐事健康", "7宫": "伴侣合作", "8宫": "隐秘危机", "9宫": "长远理念", "10宫": "事业目标", "11宫": "人际圈子", "12宫": "潜意识"
    };

    let currentRoll = "";

    function rollDice() {
        const pDice = document.getElementById('planet');
        const sDice = document.getElementById('sign');
        const hDice = document.getElementById('house');
        const resBox = document.getElementById('result-box');
        const saveBtn = document.getElementById('btn-save');
        const question = document.getElementById('user-question').value.trim();

        // 添加动效
        [pDice, sDice, hDice].forEach(d => d.classList.add('shake'));
        resBox.style.display = "none";
        saveBtn.style.display = "none";

        setTimeout(() => {
            const p = pool.planets[Math.floor(Math.random() * 12)];
            const s = pool.signs[Math.floor(Math.random() * 12)];
            const h = pool.houses[Math.floor(Math.random() * 12)];
            
            pDice.innerHTML = `<span class="dice-label">行星</span>${p}`;
            sDice.innerHTML = `<span class="dice-label">星座</span>${s}`;
            hDice.innerHTML = `<span class="dice-label">宫位</span>${h}`;
            
            [pDice, sDice, hDice].forEach(d => d.classList.remove('shake'));

            currentRoll = `${p} · ${s} · ${h}`;
            
            // 构建带有问题上下文的AI解析 (前缀 + 行星 + 星座 + 宫位组合)
            let prefix = question ? `针对“${question}”：` : "当前提示：";
            let reading = `${prefix}在${h}(${dict[h]})中，建议以${s}的${dict[s]}方式运作${p}(${dict[p]})。顺势而为。`;
            
            document.getElementById('ai-reading').innerText = reading;
            resBox.style.display = "block";
            saveBtn.style.display = "inline-block";
        }, 400);
    }

    function saveResult() {
        if (!currentRoll) return;
        let history = JSON.parse(localStorage.getItem('hexoAstroDice')) || {};
        history[currentRoll] = (history[currentRoll] || 0) + 1;
        localStorage.setItem('hexoAstroDice', JSON.stringify(history));
        
        document.getElementById('btn-save').style.display = "none";
        renderStats();
    }

    function renderStats() {
        const history = JSON.parse(localStorage.getItem('hexoAstroDice')) || {};
        const sorted = Object.entries(history).sort((a, b) => b[1] - a[1]).slice(0, 3);
        const listDiv = document.getElementById('stats-list');
        
        if (sorted.length === 0) {
            listDiv.innerText = "暂无记录";
            return;
        }
        
        listDiv.innerHTML = sorted.map(([roll, count]) => 
            `<div class="stats-item"><span>🔮 ${roll}</span><span>共 ${count} 次</span></div>`
        ).join('');
    }

    window.onload = renderStats;
</script>
</body>
</html>
