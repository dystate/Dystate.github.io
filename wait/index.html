

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --mu-bg: #f3eadf;
      --mu-card: #fffaf3;
      --mu-panel: #efe0cf;
      --mu-text: #2f2117;
      --mu-muted: #8f7965;
      --mu-border: #ddc8b3;
      --mu-accent: #bd7a3f;
      --mu-accent-2: #6f472b;
      --mu-soft: rgba(189, 122, 63, .12);
      --mu-soft-2: rgba(189, 122, 63, .2);
      --mu-danger: #bf5b50;
      --mu-radius: 26px;
      --mu-shadow: none;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--mu-bg);
      color: var(--mu-text);
      font-family: "Inter", "HarmonyOS Sans SC", "MiSans", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    button { border: 0; cursor: pointer; }
    
    /* Sidebar Overlay (Mobile) */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(47, 33, 23, .4);
      z-index: 90;
      opacity: 0;
      transition: opacity .3s ease;
    }
    .sidebar-overlay.show { display: block; opacity: 1; }

    /* Mobile Top Bar */
    .mobile-top-bar {
      display: none;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
      font-size: 18px;
      font-weight: 850;
      color: var(--mu-text);
    }
    #hamburgerBtn {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: #ead9c6;
      color: var(--mu-text);
      display: grid;
      place-items: center;
      font-size: 18px;
    }

    .mu-sidebar {
      width: 238px;
      min-height: 100vh;
      height: 100vh;
      position: sticky;
      top: 0;
      padding: 28px 18px;
      background: #ead9c6;
      border-right: 1px solid #d3b79d;
      overflow-y: auto;
      flex: 0 0 238px;
      z-index: 100;
    }
    .mu-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      letter-spacing: .04em;
      font-weight: 800;
      font-size: 15px;
      color: var(--mu-text);
    }
    .mu-logo i {
      width: 34px;
      height: 34px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      background: #d2a06f;
      color: #fffaf3;
    }
    .nav-card {
      padding: 10px 8px;
      border: 0;
      border-radius: 20px;
      background: #f7ecdf;
      margin-bottom: 14px;
    }
    .mu-nav-title {
      color: #9c8068;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .1em;
      margin: 8px 10px 10px;
    }
    .mu-nav-list { list-style: none; display: grid; gap: 3px; }
    .mu-nav-item {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      min-height: 40px;
      padding: 9px 10px;
      border-radius: 14px;
      color: #6d5847;
      font-size: 12px;
      background: transparent;
      transition: .22s ease;
    }
    .mu-nav-item .nav-left { display: flex; align-items: center; gap: 9px; font-weight: 700; }
    .mu-nav-item i { width: 18px; color: #a66f42; font-size: 13px; }
    .mu-nav-item:hover, .mu-nav-item.active {
      background: #ead6c0;
      color: var(--mu-text);
      font-weight: 800;
    }
    .mu-nav-item.home-item.active { background: var(--mu-accent); color: #fffaf3; }
    .mu-nav-item.home-item.active i,
    .mu-nav-item.home-item.active .mu-count { color: #fffaf3; }
    .mu-count {
      min-width: 26px;
      padding: 2px 7px;
      border-radius: 999px;
      text-align: center;
      font-size: 10px;
      background: #ead6c0;
      color: #8b6d55;
      font-weight: 700;
    }
    .mu-nav-item.active:not(.home-item) .mu-count { background: #d2a06f; color: #fffaf3; }

    .mu-main {
      flex: 1;
      max-width: 1220px;
      margin: 0 auto;
      overflow: visible;
      padding: 34px 34px 64px;
    }
    .mu-header {
      display: grid;
      grid-template-columns: minmax(240px, 360px) minmax(220px, 1fr) auto;
      gap: 14px;
      align-items: center;
      margin-bottom: 18px;
    }
    .mu-search {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 48px;
      padding: 12px 16px;
      background: var(--mu-card);
      border: 1px solid var(--mu-border);
      border-radius: 22px;
    }
    .mu-search i { color: var(--mu-muted); }
    .mu-search input { width: 100%; background: transparent; border: 0; outline: 0; color: var(--mu-text); }
    .mu-search input::placeholder { color: #aa927b; }
    .header-controls {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .view-switch {
      display: inline-flex;
      align-items: center;
      background: var(--mu-card);
      border: 1px solid var(--mu-border);
      border-radius: 22px;
      padding: 4px;
    }
    .view-btn {
      min-width: 92px;
      padding: 10px 14px;
      border-radius: 16px;
      background: transparent;
      color: #8f7965;
      font-weight: 800;
      font-size: 12px;
      transition: .2s ease;
    }
    .view-btn.active { background: #bd7a3f; color: #fffaf3; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 12px 17px;
      border-radius: 17px;
      font-weight: 800;
      font-size: 13px;
      transition: .22s ease;
      white-space: nowrap;
    }
    .btn-ghost { color: var(--mu-text); background: var(--mu-card); border: 1px solid var(--mu-border); }
    .btn-primary { background: var(--mu-accent); color: #fffaf3; }
    .btn:hover { background: #ead6c0; color: var(--mu-text); }
    .btn-primary:hover { background: #a86635; color: #fffaf3; }
    .toolbar-note {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 16px;
      color: var(--mu-muted);
      font-size: 13px;
      flex-wrap: wrap;
    }
    .toolbar-note strong { color: var(--mu-text); }
    .active-filter { color: var(--mu-text); font-weight: 800; }
    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 18px 0 18px;
      font-size: 20px;
      color: var(--mu-text);
      font-weight: 850;
    }
    .section-sub { color: var(--mu-muted); font-size: 13px; margin-top: -8px; margin-bottom: 20px; }
    .mu-grid { display: grid; gap: 16px; }
    .mu-grid.view-cards {
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      align-items: start;
    }
    
    /* Shared styles for Cards and List Rows */
    .exhibit-card, .list-row {
      background: var(--mu-card);
      border: 1px solid var(--mu-border);
      border-radius: 28px;
      transition: border-color .24s ease, background .24s ease;
    }
    .exhibit-card:hover, .list-row:hover { background: #fffdf8; border-color: #c79d78; }
    .exhibit-card { padding: 18px; display: flex; flex-direction: column; overflow: hidden; }
    
    .card-header, .list-title-wrap { margin-bottom: 14px; }
    .card-header h3, .list-title-wrap h3 { font-size: 20px; line-height: 1.25; color: var(--mu-text); font-weight: 850; letter-spacing: 0; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .btn-edit {
      width: 40px; height: 40px; border-radius: 15px; color: #8d6646; background: #f0dfcc;
      flex: 0 0 auto; transition: .2s ease; display: grid; place-items: center;
    }
    .btn-edit:hover { color: #fffaf3; background: var(--mu-accent); }
    .card-body { display: flex; gap: 18px; min-height: 0; flex: 1; align-items: stretch; }
    .card-img-wrapper {
      position: relative; flex: 0 0 44%; min-height: 238px; border: 0; border-radius: 20px;
      overflow: hidden; background: #ead8c3;
    }
    .card-img-wrapper img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .empty-img { width: 100%; height: 100%; display: grid; place-items: center; color: var(--mu-muted); font-size: 34px; }
    .card-no {
      position: absolute; top: 10px; left: 10px; padding: 5px 10px; border-radius: 999px;
      font-size: 11px; font-weight: 900; letter-spacing: .04em; background: #bd7a3f; color: #fffaf3;
    }
    .card-info { flex: 1; display: flex; flex-direction: column; gap: 14px; justify-content: center; }
    
    .meta-grid { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .meta-pill {
      display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 0;
      border-radius: 18px; background: #f2e2cf; min-height: 66px;
    }
    .exhibit-card .meta-pill.price-pill { grid-column: 1 / -1; }
    .meta-pill:nth-child(1) { background: #f4d76a; color: #231a0f; }
    .meta-pill:nth-child(2) { background: #f39a5d; color: #25130a; }
    .meta-pill:nth-child(3) { background: #c983e8; color: #1f1026; }
    .meta-pill:nth-child(4) { background: #8ddd63; color: #12210d; }
    .meta-pill:nth-child(5) { background: #7bd4e7; color: #0d1d22; }
    
    .meta-pill i, .meta-pill .meta-label, .meta-pill .meta-value, .meta-pill.price-pill .meta-value { color: inherit; }
    .meta-pill i { width: 18px; text-align: center; font-size: 15px; flex: 0 0 auto; }
    .meta-content { min-width: 0; }
    .meta-label { display: block; opacity: .72; font-size: 10px; letter-spacing: .04em; font-weight: 800; margin-bottom: 3px; }
    .meta-value {
      display: block; font-size: 17px; font-weight: 900; line-height: 1.2;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-footer { margin-top: 16px; padding-top: 14px; border-top: 1px solid #e0c9b2; color: var(--mu-muted); font-size: 13px; line-height: 1.7; }
    
    /* Desktop List View Enhancements */
    .mu-grid.view-list { grid-template-columns: 1fr; gap: 12px; }
    .list-row { display: block; padding: 16px 18px; border-left: 0; }
    .list-main-wrap { display: flex; gap: 18px; align-items: stretch; }
    .list-left-img {
      width: 110px; flex-shrink: 0; border-radius: 16px; background: #ead8c3;
      border: 1px solid var(--mu-border); overflow: hidden; display: flex; flex-direction: column;
    }
    .list-left-img img { width: 100%; height: 100%; object-fit: cover; }
    .list-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; justify-content: center; }
    .list-top { display: grid; grid-template-columns: minmax(180px, 1fr) auto; align-items: center; gap: 18px; }
    .list-title-wrap h3 { margin-bottom: 4px; }
    .list-number-text { color: var(--mu-accent-2); font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
    
    .list-row .meta-grid { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; border: 0; }
    .list-row .meta-pill {
      min-height: 58px; border: 0; border-radius: 16px; background: #f5e8d8; color: var(--mu-text);
    }
    .list-row .meta-pill:nth-child(1) { border-top: 3px solid #f4d76a; background: #fdfaf0; }
    .list-row .meta-pill:nth-child(2) { border-top: 3px solid #f39a5d; background: #fef7f2; }
    .list-row .meta-pill:nth-child(3) { border-top: 3px solid #c983e8; background: #fbf5fd; }
    .list-row .meta-pill:nth-child(4) { border-top: 3px solid #8ddd63; background: #f8fdf4; }
    .list-row .meta-pill:nth-child(5) { border-top: 3px solid #7bd4e7; background: #f5fbfe; }
    
    .list-note { font-size: 13px; color: var(--mu-muted); line-height: 1.65; padding-top: 10px; border-top: 1px solid #e0c9b2; }
    .img-error-text {
      display: grid; place-items: center; text-align: center; gap: 8px; padding: 18px;
      color: var(--mu-muted); font-size: 12px; line-height: 1.5;
    }
    .img-error-text i { font-size: 28px; color: var(--mu-danger); }

    .empty-state {
      min-height: 340px; display: grid; place-items: center; text-align: center;
      background: var(--mu-card); color: var(--mu-muted);
      border: 1px solid var(--mu-border); border-radius: 22px; padding: 20px;
    }
    .empty-state i { font-size: 42px; color: var(--mu-accent); margin-bottom: 14px; }
    
    .modal-overlay, .drawer-overlay {
      position: fixed; inset: 0; z-index: 200; display: none;
      background: rgba(47, 33, 23, .32);
    }
    .modal-overlay.show, .drawer-overlay.show { display: flex; }
    .modal-overlay { align-items: center; justify-content: center; padding: 20px; }
    .modal-box {
      width: min(760px, 96vw); max-height: 92vh; overflow-y: auto;
      background: #fffaf3; border: 1px solid var(--mu-border); border-radius: 28px;
      color: var(--mu-text); padding: 28px; animation: pop .22s ease;
    }
    @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
    .modal-header h2 { font-size: 22px; display: flex; align-items: center; gap: 10px; }
    .btn-close {
      width: 38px; height: 38px; border-radius: 18px; background: #f5e8d8; border: 1px solid var(--mu-border);
      color: var(--mu-text);
    }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 7px; }
    .form-group.full { grid-column: 1 / -1; }
    .form-group label { font-size: 12px; color: var(--mu-muted); font-weight: 900; letter-spacing: .05em; }
    .mu-input, .mu-select, .mu-textarea {
      width: 100%; border: 1px solid var(--mu-border); border-radius: 18px; background: #f5e8d8;
      padding: 12px 13px; outline: 0; color: var(--mu-text); transition: .2s ease;
    }
    .mu-input:focus, .mu-select:focus, .mu-textarea:focus { background: #fffdf8; outline: 2px solid rgba(189, 122, 63, .24); border-color: var(--mu-accent); }
    .mu-textarea { min-height: 90px; resize: vertical; }
    .upload-box {
      position: relative; min-height: 170px; display: grid; place-items: center; gap: 6px;
      border: 2px dashed var(--mu-border); border-radius: 18px; background: #f2e2cf;
      color: var(--mu-text); cursor: pointer; overflow: hidden;
    }
    .upload-box:hover { border-color: var(--mu-accent); color: var(--mu-accent-2); }
    .upload-box input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .upload-inner { text-align: center; pointer-events: none; }
    .upload-inner i { font-size: 30px; margin-bottom: 8px; color: var(--mu-accent); }
    .preview-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .form-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 22px; }
    .form-actions-right { display: flex; gap: 12px; }
    .btn-danger { background: #f8ded9; color: #9d3f37; }
    .drawer-overlay { justify-content: flex-end; }
    .drawer {
      width: min(390px, 92vw); height: 100%; padding: 30px; background: #fffaf3;
      border-left: 1px solid var(--mu-border); border-radius: 28px 0 0 28px; color: var(--mu-text);
      animation: slide .22s ease; overflow-y: auto;
    }
    @keyframes slide { from { transform: translateX(24px); opacity: .2; } to { transform: none; opacity: 1; } }
    .filter-row { display: grid; gap: 8px; margin-bottom: 16px; }
    .bulk-toolbar {
      display: none; align-items: center; justify-content: space-between; gap: 12px;
      margin: 0 0 18px; padding: 13px 16px; border: 1px solid var(--mu-border);
      border-radius: 22px; background: var(--mu-card); color: var(--mu-muted); font-size: 13px; flex-wrap: wrap;
    }
    .bulk-toolbar.show { display: flex; }
    .bulk-left, .bulk-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .bulk-check { position: absolute; top: 14px; right: 14px; z-index: 5; width: 26px; height: 26px; accent-color: var(--mu-accent); cursor: pointer; }
    .exhibit-card.bulk-mode, .list-row.bulk-mode { padding-top: 50px; }
    .list-row .bulk-check { top: 16px; left: 16px; right: auto; }
    .list-row.bulk-mode { position: relative; padding-left: 62px; }
    .btn-danger-strong { background: var(--mu-danger); color: #fffaf3; }
    .btn-danger-strong:hover { background: #7d3933; }
    .btn[disabled] { opacity: .45; cursor: not-allowed; transform: none !important; }

    /* ====================================================================
       MOBILE RESPONSIVENESS (Deep Overrides for List-Only Mobile View)
       ==================================================================== */
    @media (max-width: 980px) {
      body { display: block; }
      /* Drawer Sidebar */
      .mu-sidebar {
        position: fixed; left: -300px; top: 0; z-index: 100;
        transition: left .3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 4px 0 24px rgba(0,0,0,0.1);
      }
      .mu-sidebar.open { left: 0; }
      
      .mobile-top-bar { display: flex; }
      .mu-main { padding: 24px 18px 50px; }
      
      /* Header restyling */
      .mu-header { display: flex; flex-direction: column; align-items: stretch; gap: 12px; }
      .header-controls { justify-content: space-between; width: 100%; gap: 8px; }
      .header-controls .btn { flex: 1; padding: 10px; font-size: 12px; }
      #openAddBtn { flex: 1.2; } /* Make 'Add' slightly larger */
      
      .form-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 768px) {
      /* Force hide view switch and specific pills */
      .view-switch { display: none !important; }
      .pill-category, .pill-number, .pill-date { display: none !important; }
      
      /* Mobile List View Deep Customization */
      .list-row { padding: 12px; border-radius: 20px; }
      .list-main-wrap { gap: 12px; align-items: center; }
      
      .list-left-img {
        width: 72px; height: 72px; border-radius: 12px;
      }
      .list-left-img .empty-img { font-size: 22px; }
      .list-left-img .img-error-text { font-size: 10px; padding: 4px; }
      .list-left-img .img-error-text i { font-size: 16px; }
      
      .list-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
      .list-title-wrap h3 { font-size: 16px; margin-bottom: 2px; }
      .list-number-text { display: none; }
      .list-note { display: none; } /* Compact mobile view */
      
      .list-row .meta-grid { display: flex; gap: 8px; }
      .list-row .meta-pill {
        flex: 1; min-height: 44px; padding: 6px 10px; border-radius: 12px;
      }
      .list-row .meta-pill i { font-size: 12px; }
      .meta-label { font-size: 9px; margin-bottom: 1px; }
      .meta-value { font-size: 13px; }
      
      /* Mobile Bulk Adjustments */
      .list-row.bulk-mode { padding-left: 44px; }
      .list-row .bulk-check { top: 38px; left: 12px; }
      .bulk-toolbar { flex-direction: column; align-items: stretch; gap: 12px; }
      .bulk-actions { justify-content: space-between; width: 100%; }
      .bulk-actions .btn { flex: 1; padding: 8px; font-size: 11px; }
      
      .form-actions { flex-direction: column; align-items: stretch; }
      .form-actions-right { width: 100%; }
      .form-actions-right .btn, .form-actions .btn { width: 100%; }
    }
  </style>
</head>
<body>
  
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <aside class="mu-sidebar">
    <div class="mu-logo"><i class="fa-solid fa-building-columns"></i><span>LIFE MUSEUM</span></div>
    <div class="nav-card">
      <div class="mu-nav-title">主页 Home</div>
      <ul class="mu-nav-list" id="homeNav"></ul>
    </div>
    <div class="nav-card">
      <div class="mu-nav-title">类别 Category</div>
      <ul class="mu-nav-list" id="categoryNav"></ul>
    </div>
    <div class="nav-card">
      <div class="mu-nav-title">状态 Status</div>
      <ul class="mu-nav-list" id="statusNav"></ul>
    </div>
  </aside>

  <main class="mu-main">
    <header class="mu-header">
      <div class="mobile-top-bar">
        <button id="hamburgerBtn"><i class="fa-solid fa-bars"></i></button>
        <span class="mobile-title">个人博物馆</span>
      </div>
      <div class="mu-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="searchInput" type="search" placeholder="检索馆藏：名称 / 编号 / 备注" />
      </div>
      <div class="header-controls">
        <div class="view-switch" aria-label="视图切换">
          <button class="view-btn active" id="cardViewBtn" type="button"><i class="fa-solid fa-table-cells-large"></i> 卡片</button>
          <button class="view-btn" id="listViewBtn" type="button"><i class="fa-solid fa-list"></i> 清单</button>
        </div>
        <button class="btn btn-ghost" id="openFilterBtn"><i class="fa-solid fa-sliders"></i> 筛选</button>
        <button class="btn btn-ghost" id="bulkModeBtn"><i class="fa-solid fa-list-check"></i> 批量管理</button>

    <div class="toolbar-note">

    <h2 class="section-title"><i class="fa-solid fa-box-archive" id="sectionTitleIcon"></i><span id="sectionTitleText">全部藏品</span></h2>

    <div class="bulk-toolbar" id="bulkToolbar">

  <div class="modal-overlay" id="itemModal" aria-hidden="true">
    <section class="modal-box" role="dialog" aria-modal="true">
      <div class="modal-header">

            <button class="btn btn-primary" type="submit"><i class="fa-solid fa-floppy-disk"></i> 保存入馆</button>

  <div class="drawer-overlay" id="filterDrawer" aria-hidden="true">
    <aside class="drawer">
      <div class="modal-header">
        <h2><i class="fa-solid fa-filter" style="color:var(--mu-accent)"></i> 高级筛选</h2>
        <button class="btn-close" type="button" id="closeFilterBtn"><i class="fa-solid fa-xmark"></i></button>

        <button class="btn btn-ghost" id="resetFilterBtn"><i class="fa-solid fa-rotate-left"></i> 重置</button>
        <button class="btn btn-primary" id="applyFilterBtn"><i class="fa-solid fa-check"></i> 应用筛选</button>

  <script>
    // ==============================
    // 0. Supabase 双端同步预留区
    // ==============================
    const USE_SUPABASE = true;
    const SUPABASE_URL = "https://mqlctakdtjanshgsdwal.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_mLz7oSFvfPZDFxJgApI1JA_0oE4gla1";
    const supabaseClient = USE_SUPABASE && window.supabase
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    async function fetchFromSupabase() {
      if (!supabaseClient) return null;
      const { data, error } = await supabaseClient
        .from("museum_items")
        .select("id,name,category,status,number,entry_date,price,note,photo_url")
        .order("entry_date", { ascending: false });
      if (error) {
        console.warn("Supabase 读取失败：", error.message);
        return null;
      }
      return (data || []).map(item => ({
        id: item.id,
        name: item.name,
        category: item.category,
        status: item.status,
        number: item.number,
        entryDate: item.entry_date,
        price: item.price,
        note: item.note,
        photo: normalizePhotoUrl(item.photo_url)
      }));
    }

    async function uploadPhotoToSupabase(file, itemId, existingUrl = "") {
      if (!file) return existingUrl || photoBuffer || "";
      if (!supabaseClient) return existingUrl || photoBuffer || "";

      const fileExt = file.name.split(".").pop();
      const filePath = `${itemId}/${Date.now()}.${fileExt}`;

      const { error } = await supabaseClient.storage
          .from("museum-photos")
          .upload(filePath, file, { cacheControl: "3600", upsert: true });

      if (error) {
          console.error("图片上传失败：", error.message);
          alert("图片上传失败：" + error.message);
          return existingUrl || photoBuffer || "";
      }

      const { data } = supabaseClient.storage.from("museum-photos").getPublicUrl(filePath);
      return data.publicUrl;
    }

    async function saveToSupabase(item) {
      if (!supabaseClient) return false;
      const payload = {
        id: item.id, name: item.name, category: item.category, status: item.status,
        number: item.number, entry_date: item.entryDate, price: item.price,
        note: item.note, photo_url: item.photo
      };
      const { error } = await supabaseClient.from("museum_items").upsert(payload);
      if (error) { alert("Supabase 保存失败：" + error.message); return false; }
      return true;
    }

    async function deleteFromSupabase(id) {
      if (!supabaseClient) return true;
      const { error } = await supabaseClient.from("museum_items").delete().eq("id", id);
      if (error) { alert("Supabase 删除失败：" + error.message); return false; }
      return true;
    }

    async function deleteManyFromSupabase(ids) {
      if (!supabaseClient || !ids.length) return true;
      const { error } = await supabaseClient.from("museum_items").delete().in("id", ids);
      if (error) { alert("Supabase 批量删除失败：" + error.message); return false; }
      return true;
    }

    // ==============================
    // 1. 基础数据与状态
    // ==============================
    const CATEGORIES = [
      ["桌游", "fa-dice"], ["餐具", "fa-utensils"], ["寝具", "fa-bed"],
      ["摆件", "fa-gem"], ["穿戴", "fa-shirt"], ["电子", "fa-laptop"], ["文具", "fa-book-open"]
    ];
    const STATUSES = [["在用", "fa-play"], ["闲置", "fa-pause"], ["已用", "fa-check-double"], ["丢弃", "fa-trash-can"]];
    const STORAGE_KEY = "life_museum_items_v2";
    const VIEW_KEY = "life_museum_view_mode";
    const today = new Date().toISOString().slice(0, 10);
    
    let museumItems = [];
    let photoBuffer = "";
    let selectedPhotoFile = null;
    let bulkMode = false;
    let selectedIds = new Set();
    let currentView = localStorage.getItem(VIEW_KEY) || "cards";
    let filters = { category: "全部", status: "全部", from: "", to: "", minPrice: "", maxPrice: "", navType: "all", navValue: "全部" };

    const seedItems = [
      { id: crypto.randomUUID(), name: "任天堂 Switch OLED", category: "电子", status: "在用", number: "No.1", entryDate: today, price: 2299, note: "用来玩《塞尔达传说》的设备。长期主义视角下，它可以提供稳定的娱乐体验，暂不更换。", photo: "https://images.unsplash.com/photo-1578308422634-1c50e1811a43?auto=format&fit=crop&q=80&w=900" },
      { id: crypto.randomUUID(), name: "卡坦岛 Catan", category: "桌游", status: "闲置", number: "No.2", entryDate: today, price: 198, note: "经典桌游，需要聚会才能开局。", photo: "https://images.unsplash.com/photo-1611891487122-207579d67d98?auto=format&fit=crop&q=80&w=900" },
      { id: crypto.randomUUID(), name: "骨瓷茶杯", category: "餐具", status: "在用", number: "No.3", entryDate: today, price: 45, note: "每天喝水用，手感轻，清洗方便。", photo: "https://images.unsplash.com/photo-1576408221840-02c3bbcbddff?auto=format&fit=crop&q=80&w=900" }
    ];

    const $ = (id) => document.getElementById(id);

    function normalizePhotoUrl(url) {
      if (!url) return "";
      let fixed = String(url).trim();
      fixed = fixed.replace(".supabase.co/rest/v1/storage/v1/", ".supabase.co/storage/v1/");
      fixed = fixed.replace(".supabase.co/rest/v1//storage/v1/", ".supabase.co/storage/v1/");
      if (!fixed.startsWith("http") && fixed.includes("museum-photos")) {
        fixed = `${SUPABASE_URL}/storage/v1/object/public/${fixed.replace(/^\/+/, "")}`;
      }
      return fixed;
    }

    function formatMoney(value) { return `¥ ${Number(value || 0).toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`; }
    function getNextNumber() {
      const nums = museumItems.map(item => Number(String(item.number).replace(/[^0-9]/g, ""))).filter(Boolean);
      return `No.${(Math.max(0, ...nums) + 1)}`;
    }
    function saveLocal() { localStorage.setItem(STORAGE_KEY, JSON.stringify(museumItems)); }
    function saveViewMode() { localStorage.setItem(VIEW_KEY, currentView); }

    function getCategoryIcon(name) { return (CATEGORIES.find(([label]) => label === name) || [null, "fa-layer-group"])[1]; }
    function getStatusIcon(name) { return (STATUSES.find(([label]) => label === name) || [null, "fa-circle"])[1]; }

    async function loadItems() {
      const cloudData = await fetchFromSupabase();
      const localData = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
      museumItems = (cloudData || localData || seedItems).map(item => ({ ...item, photo: normalizePhotoUrl(item.photo) }));
      if (!localData && !cloudData) saveLocal();
      renderAll();
    }

    function renderOptions() {
      $("categoryInput").innerHTML = CATEGORIES.map(([name]) => `<option value="${name}">${name}</option>`).join("");
      $("statusInput").innerHTML = STATUSES.map(([name]) => `<option value="${name}">${name}</option>`).join("");
      $("filterCategory").innerHTML = `<option>全部</option>` + CATEGORIES.map(([name]) => `<option>${name}</option>`).join("");
      $("filterStatus").innerHTML = `<option>全部</option>` + STATUSES.map(([name]) => `<option>${name}</option>`).join("");
      $("nameOptions").innerHTML = [...new Set(museumItems.map(i => i.name))].map(name => `<option value="${name}"></option>`).join("");
      $("numberOptions").innerHTML = Array.from({ length: Math.max(20, museumItems.length + 8) }, (_, i) => `<option value="No.${i + 1}"></option>`).join("");
    }

    function countBy(key, value) { return museumItems.filter(item => item[key] === value).length; }

    function renderNav() {
      const navClass = (type, value) => filters.navType === type && filters.navValue === value ? "active" : "";

      $("homeNav").innerHTML = `
        <li><button class="mu-nav-item home-item ${navClass("all", "全部")}" data-nav-type="all" data-nav-value="全部">
          <span class="nav-left"><i class="fa-solid fa-house"></i> 全部藏品</span><span class="mu-count">${museumItems.length}</span>
        </button></li>
      `;

      $("categoryNav").innerHTML = CATEGORIES.map(([name, icon]) => `
        <li><button class="mu-nav-item ${navClass("category", name)}" data-nav-type="category" data-nav-value="${name}">
          <span class="nav-left"><i class="fa-solid ${icon}"></i>${name}</span><span class="mu-count">${countBy("category", name)}</span>
        </button></li>
      `).join("");

      $("statusNav").innerHTML = STATUSES.map(([name, icon]) => `
        <li><button class="mu-nav-item ${navClass("status", name)}" data-nav-type="status" data-nav-value="${name}">
          <span class="nav-left"><i class="fa-solid ${icon}"></i>${name}</span><span class="mu-count">${countBy("status", name)}</span>
        </button></li>
      `).join("");

      document.querySelectorAll(".mu-nav-item").forEach(btn => btn.addEventListener("click", () => {
        const type = btn.dataset.navType;
        const value = btn.dataset.navValue;
        const same = filters.navType === type && filters.navValue === value;
        filters.navType = same || type === "all" ? "all" : type;
        filters.navValue = same || type === "all" ? "全部" : value;
        
        // Auto close sidebar on mobile after clicking nav
        if(window.innerWidth <= 980) {
           document.querySelector(".mu-sidebar").classList.remove("open");
           $("sidebarOverlay").classList.remove("show");
        }
        renderAll();
      }));
    }

    function getFilteredItems() {
      const q = $("searchInput").value.trim().toLowerCase();
      return museumItems.filter(item => {
        const hitSearch = !q || [item.name, item.number, item.note, item.category, item.status].some(v => String(v || "").toLowerCase().includes(q));
        const hitNav = filters.navType === "all" || item[filters.navType] === filters.navValue;
        const hitCategory = filters.category === "全部" || item.category === filters.category;
        const hitStatus = filters.status === "全部" || item.status === filters.status;
        const hitFrom = !filters.from || item.entryDate >= filters.from;
        const hitTo = !filters.to || item.entryDate <= filters.to;
        const hitMin = filters.minPrice === "" || Number(item.price) >= Number(filters.minPrice);
        const hitMax = filters.maxPrice === "" || Number(item.price) <= Number(filters.maxPrice);
        return hitSearch && hitNav && hitCategory && hitStatus && hitFrom && hitTo && hitMin && hitMax;
      }).sort((a, b) => new Date(b.entryDate) - new Date(a.entryDate));
    }

    function updateBulkToolbar() {
      const count = selectedIds.size;
      $("bulkToolbar").classList.toggle("show", bulkMode);
      $("selectedCount").textContent = count;
      $("deleteSelectedBtn").disabled = count === 0;
      $("bulkModeBtn").innerHTML = bulkMode ? '<i class="fa-solid fa-xmark"></i> 退出批量' : '<i class="fa-solid fa-list-check"></i> 批量管理';
    }

    function renderCollectionHeader() {
      let title = "全部藏品";
      let subtitle = "按入馆时间倒序展示，你的每一件物品都值得被认真归档。";
      let icon = "fa-box-archive";

      if (filters.navType === "category") {
        title = `${filters.navValue} 藏品`; subtitle = `当前按类别查看：${filters.navValue}`; icon = getCategoryIcon(filters.navValue);
      } else if (filters.navType === "status") {
        title = `${filters.navValue} 藏品`; subtitle = `当前按状态查看：${filters.navValue}`; icon = getStatusIcon(filters.navValue);
      }
      $("sectionTitleText").textContent = title;
      $("sectionSubtitle").textContent = subtitle;
      $("sectionTitleIcon").className = `fa-solid ${icon}`;
      $("activeFilterText").textContent = filters.navType === "all" ? "全部藏品" : `${filters.navType === "category" ? "类别" : "状态"}：${filters.navValue}`;
    }

    function imageHtml(item) {
      const photo = normalizePhotoUrl(item.photo);
      if (!photo) return `<div class="empty-img"><i class="fa-solid fa-image"></i></div>`;
      return `
        <img src="${photo}" alt="${item.name}" referrerpolicy="no-referrer"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';">
        <div class="empty-img img-error-text" style="display:none">
          <i class="fa-solid fa-triangle-exclamation"></i>
          <span>无法加载<br>图片</span>
        </div>
      `;
    }
    
    function createMetaPills(item) {
      return `
        <div class="meta-grid">
          <div class="meta-pill pill-category"><i class="fa-solid fa-layer-group"></i><div class="meta-content"><span class="meta-label">类别</span><span class="meta-value">${item.category}</span></div></div>
          <div class="meta-pill pill-status"><i class="fa-solid fa-toggle-on"></i><div class="meta-content"><span class="meta-label">状态</span><span class="meta-value">${item.status}</span></div></div>
          <div class="meta-pill pill-number"><i class="fa-solid fa-hashtag"></i><div class="meta-content"><span class="meta-label">编号</span><span class="meta-value">${item.number}</span></div></div>
          <div class="meta-pill pill-date"><i class="fa-solid fa-calendar-day"></i><div class="meta-content"><span class="meta-label">入馆日期</span><span class="meta-value">${item.entryDate}</span></div></div>
          <div class="meta-pill price-pill pill-price"><i class="fa-solid fa-yen-sign"></i><div class="meta-content"><span class="meta-label">价格</span><span class="meta-value">${formatMoney(item.price)}</span></div></div>
        </div>
      `;
    }

    function createCard(item) {
      return `
        <article class="exhibit-card ${bulkMode ? 'bulk-mode' : ''}">
          ${bulkMode ? `<input class="bulk-check" type="checkbox" data-select-id="${item.id}" ${selectedIds.has(item.id) ? "checked" : ""}>` : ""}
          <div class="card-header">
            <h3>${item.name}</h3>
            <button class="btn-edit" data-edit="${item.id}" title="编辑"><i class="fa-solid fa-pen-to-square"></i></button>
          </div>
          <div class="card-body">
            <div class="card-img-wrapper"><span class="card-no">${item.number}</span>${imageHtml(item)}</div>
            <div class="card-info">${createMetaPills(item)}</div>
          </div>
          <div class="card-footer"><strong>备注：</strong>${item.note || "暂无备注。"}</div>
        </article>
      `;
    }

    function createListRow(item) {
      return `
        <article class="list-row ${bulkMode ? 'bulk-mode' : ''}">
          ${bulkMode ? `<input class="bulk-check" type="checkbox" data-select-id="${item.id}" ${selectedIds.has(item.id) ? "checked" : ""}>` : ""}
          <div class="list-main-wrap">
            <div class="list-left-img">
               ${imageHtml(item)}
            </div>
            <div class="list-main">
              <div class="list-top">
                <div class="list-title-wrap">
                  <h3>${item.name}</h3>
                  <div class="list-number-text">馆藏档案 · ${item.number}</div>
                </div>
                <button class="btn-edit" data-edit="${item.id}" title="编辑"><i class="fa-solid fa-pen-to-square"></i></button>
              </div>
              ${createMetaPills(item)}
              <div class="list-note"><strong>备注：</strong>${item.note || "暂无备注。"}</div>
            </div>
          </div>
        </article>
      `;
    }

    function renderCollection() {
      const items = getFilteredItems();
      $("totalCount").textContent = museumItems.length;
      $("shownCount").textContent = items.length;
      
      const isMobile = window.innerWidth <= 768;
      const actualView = isMobile ? "list" : currentView;

      $("cardViewBtn").classList.toggle("active", actualView === "cards");
      $("listViewBtn").classList.toggle("active", actualView === "list");
      $("exhibitGrid").className = `mu-grid ${actualView === "cards" ? "view-cards" : "view-list"}`;
      
      renderCollectionHeader();
      selectedIds = new Set([...selectedIds].filter(id => items.some(item => item.id === id)));
      updateBulkToolbar();

      if (!items.length) {
        $("exhibitGrid").innerHTML = `<div class="empty-state"><div><i class="fa-solid fa-box-open"></i><h3>还没有符合条件的展品</h3><p>点击右上角“新增入馆”，把第一件物品放进你的个人博物馆。</p></div></div>`;
        return;
      }

      $("exhibitGrid").innerHTML = actualView === "cards"
        ? items.map(item => createCard(item)).join("")
        : items.map(item => createListRow(item)).join("");

      document.querySelectorAll("[data-edit]").forEach(btn => btn.addEventListener("click", () => openEditModal(btn.dataset.edit)));
      document.querySelectorAll("[data-select-id]").forEach(input => {
        input.addEventListener("change", () => {
          if (input.checked) selectedIds.add(input.dataset.selectId);
          else selectedIds.delete(input.dataset.selectId);
          updateBulkToolbar();
        });
      });
    }

    function renderAll() {
      renderOptions();
      renderNav();
      renderCollection();
    }
    
    // Auto re-render if transitioning mobile breakpoints
    let lastIsMobile = window.innerWidth <= 768;
    window.addEventListener("resize", () => {
       const isMobile = window.innerWidth <= 768;
       if(isMobile !== lastIsMobile) {
          lastIsMobile = isMobile;
          renderCollection();
       }
    });

    // Mobile Sidebar Logic
    $("hamburgerBtn").addEventListener("click", () => {
       document.querySelector(".mu-sidebar").classList.add("open");
       $("sidebarOverlay").classList.add("show");
    });
    $("sidebarOverlay").addEventListener("click", () => {
       document.querySelector(".mu-sidebar").classList.remove("open");
       $("sidebarOverlay").classList.remove("show");
    });

    // Modal Logic
    function openAddModal() {
      photoBuffer = ""; selectedPhotoFile = null;
      $("itemForm").reset(); $("photoInput").value = ""; $("editingId").value = "";
      $("numberInput").value = getNextNumber(); $("dateInput").value = today;
      $("photoPreview").style.display = "none"; $("uploadInner").style.display = "block";
      $("modalTitle").innerHTML = `<i class="fa-solid fa-box-open" style="color:var(--mu-accent)"></i> 藏品入馆登记`;
      $("deleteBtn").style.visibility = "hidden";
      $("itemModal").classList.add("show");
    }

    function openEditModal(id) {
      const item = museumItems.find(i => i.id === id);
      if (!item) return;
      photoBuffer = item.photo || ""; selectedPhotoFile = null;
      $("photoInput").value = ""; $("editingId").value = item.id;
      $("nameInput").value = item.name; $("numberInput").value = item.number;
      $("categoryInput").value = item.category; $("statusInput").value = item.status;
      $("dateInput").value = item.entryDate; $("priceInput").value = item.price;
      $("noteInput").value = item.note || "";
      $("modalTitle").innerHTML = `<i class="fa-solid fa-pen-to-square" style="color:var(--mu-accent)"></i> 编辑展品档案`;
      $("deleteBtn").style.visibility = "visible";
      
      if (photoBuffer) {
        $("photoPreview").src = photoBuffer; $("photoPreview").style.display = "block"; $("uploadInner").style.display = "none";
      } else {
        $("photoPreview").style.display = "none"; $("uploadInner").style.display = "block";
      }
      $("itemModal").classList.add("show");
    }

    function closeModal() { $("itemModal").classList.remove("show"); }

    $("photoInput").addEventListener("change", (event) => {
      const file = event.target.files[0];
      if (!file) return;
      selectedPhotoFile = file;
      $("photoPreview").src = URL.createObjectURL(file);
      $("photoPreview").style.display = "block";
      $("uploadInner").style.display = "none";
    });

    $("itemForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const id = $("editingId").value || crypto.randomUUID();
      const oldItem = museumItems.find(i => i.id === id);
      const photoUrl = await uploadPhotoToSupabase(selectedPhotoFile, id, oldItem?.photo || "");
      const item = {
        id, name: $("nameInput").value.trim(), number: $("numberInput").value.trim(),
        category: $("categoryInput").value, status: $("statusInput").value,
        entryDate: $("dateInput").value, price: Number($("priceInput").value || 0),
        note: $("noteInput").value.trim(), photo: normalizePhotoUrl(photoUrl)
      };
      const index = museumItems.findIndex(i => i.id === id);
      if (index >= 0) museumItems[index] = item; else museumItems.unshift(item);
      saveLocal();
      const ok = await saveToSupabase(item);
      if (USE_SUPABASE && !ok) return;
      selectedPhotoFile = null;
      closeModal();
      renderAll();
    });

    $("deleteBtn").addEventListener("click", async () => {
      const id = $("editingId").value;
      if (!id) return;
      if (!confirm("确认将这件藏品从博物馆移除吗？")) return;
      const ok = await deleteFromSupabase(id);
      if (USE_SUPABASE && !ok) return;
      museumItems = museumItems.filter(item => item.id !== id);
      saveLocal();
      closeModal();
      renderAll();
    });

    // Bindings
    $("searchInput").addEventListener("input", renderCollection);
    $("openAddBtn").addEventListener("click", openAddModal);
    $("closeModalBtn").addEventListener("click", closeModal);
    $("cancelBtn").addEventListener("click", closeModal);
    $("itemModal").addEventListener("click", (e) => { if (e.target === $("itemModal")) closeModal(); });

    $("cardViewBtn").addEventListener("click", () => { currentView = "cards"; saveViewMode(); renderCollection(); });
    $("listViewBtn").addEventListener("click", () => { currentView = "list"; saveViewMode(); renderCollection(); });

    $("openFilterBtn").addEventListener("click", () => {
      $("filterCategory").value = filters.category; $("filterStatus").value = filters.status;
      $("filterFrom").value = filters.from; $("filterTo").value = filters.to;
      $("filterMinPrice").value = filters.minPrice; $("filterMaxPrice").value = filters.maxPrice;
      $("filterDrawer").classList.add("show");
    });
    $("closeFilterBtn").addEventListener("click", () => $("filterDrawer").classList.remove("show"));
    $("filterDrawer").addEventListener("click", (e) => { if (e.target === $("filterDrawer")) $("filterDrawer").classList.remove("show"); });
    
    $("applyFilterBtn").addEventListener("click", () => {
      filters.category = $("filterCategory").value; filters.status = $("filterStatus").value;
      filters.from = $("filterFrom").value; filters.to = $("filterTo").value;
      filters.minPrice = $("filterMinPrice").value; filters.maxPrice = $("filterMaxPrice").value;
      $("filterDrawer").classList.remove("show");
      renderCollection();
    });
    $("resetFilterBtn").addEventListener("click", () => {
      filters = { category: "全部", status: "全部", from: "", to: "", minPrice: "", maxPrice: "", navType: "all", navValue: "全部" };
      $("filterDrawer").classList.remove("show");
      renderAll();
    });

    $("bulkModeBtn").addEventListener("click", () => { bulkMode = !bulkMode; if (!bulkMode) selectedIds.clear(); renderCollection(); });
    $("selectAllVisibleBtn").addEventListener("click", () => { getFilteredItems().forEach(item => selectedIds.add(item.id)); renderCollection(); });
    $("clearSelectedBtn").addEventListener("click", () => { selectedIds.clear(); renderCollection(); });
    $("deleteSelectedBtn").addEventListener("click", async () => {
      const ids = [...selectedIds];
      if (!ids.length) return;
      if (!confirm(`确认批量删除选中的 ${ids.length} 件藏品吗？此操作不可撤销。`)) return;
      const ok = await deleteManyFromSupabase(ids);
      if (USE_SUPABASE && !ok) return;
      museumItems = museumItems.filter(item => !selectedIds.has(item.id));
      selectedIds.clear();
      saveLocal();
      renderAll();
    });

    document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeModal(); $("filterDrawer").classList.remove("show"); } });

    loadItems();
  </script>
</body>
</html>
